# Production values for email-service
# Namespace: production

replicaCount: 3

image:
  registry: ghcr.io
  repository: kpeewu/tissi-mah/email-service
  pullPolicy: Always
  tag: ""  # Set via CI/CD with semver tag

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "9090"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

service:
  type: ClusterIP
  port: 50061

config:
  environment: "prod"
  logLevel: "warn"
  emailFrom: ""      # adresse email OVH — doit être identique à secrets.smtpUsername
  smtpHost: "ssl0.ovh.net"
  smtpPort: "465"
  extra: {}

secrets:
  smtpUsername: ""   # adresse email OVH complète
  smtpPassword: ""   # mot de passe du compte OVH
  extra: {}

probes:
  enabled: true
  liveness:
    initialDelaySeconds: 20
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 3
  readiness:
    initialDelaySeconds: 15
    periodSeconds: 15
    timeoutSeconds: 10
    failureThreshold: 3

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 200m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 60
  targetMemoryUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 2

nodeSelector: {}
tolerations: []
affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchExpressions:
            - key: app.kubernetes.io/name
              operator: In
              values:
                - email-service
        topologyKey: kubernetes.io/hostname

imagePullSecrets:
  - name: ghcr-secret
