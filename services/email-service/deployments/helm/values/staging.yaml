# Staging values for email-service
# Namespace: staging

replicaCount: 2

image:
  registry: ghcr.io
  repository: kpeewu/tissi-mah/email-service
  pullPolicy: Always
  tag: "staging"

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations:
    eks.amazonaws.com/role-arn: ""  # Set via CI/CD
  name: ""

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "9090"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

service:
  type: ClusterIP
  port: 50061

config:
  environment: "staging"
  logLevel: "info"
  emailFrom: ""      # adresse email OVH — doit être identique à secrets.smtpUsername
  smtpHost: "ssl0.ovh.net"
  smtpPort: "465"
  extra: {}

secrets:
  smtpUsername: ""   # adresse email OVH complète (ex: prenom.nom@domain.tld)
  smtpPassword: ""   # mot de passe du compte OVH
  extra: {}

probes:
  enabled: true
  liveness:
    initialDelaySeconds: 15
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

resources:
  limits:
    cpu: 300m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: true
  minAvailable: 1

nodeSelector: {}
tolerations: []
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - email-service
          topologyKey: kubernetes.io/hostname

imagePullSecrets:
  - name: ghcr-secret
