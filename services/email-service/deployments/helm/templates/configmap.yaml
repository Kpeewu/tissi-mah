apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "email-service.fullname" . }}
  labels:
    {{- include "email-service.labels" . | nindent 4 }}
data:
  ENVIRONMENT: {{ .Values.config.environment | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  GRPC_PORT: {{ .Values.service.port | quote }}
  EMAIL_FROM: {{ .Values.config.emailFrom | quote }}
  SMTP_HOST: {{ .Values.config.smtpHost | default "ssl0.ovh.net" | quote }}
  SMTP_PORT: {{ .Values.config.smtpPort | default "465" | quote }}
  {{- range $key, $value := .Values.config.extra }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
