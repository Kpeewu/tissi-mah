# Staging values for payment-service
# Namespace: staging

replicaCount: 2

image:
  registry: ghcr.io
  repository: kpeewu/tissi-mah/payment-service
  pullPolicy: Always
  tag: "staging"

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations:
    eks.amazonaws.com/role-arn: ""  # Set via CI/CD
  name: ""

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "9090"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

service:
  type: ClusterIP
  port: 50059

config:
  environment: "staging"
  logLevel: "info"
  bookingServiceHost: "booking-service"
  bookingServicePort: "50058"
  userServiceHost: "user-service"
  userServicePort: "50052"
  payoutIntervalSeconds: "300"
  contestationDelayHours: "2"
  platformFeePercent: "10"
  cancellationFullRefundHours: "24"
  cancellationGracePeriodMinutes: "15"
  noshowDriverDelayMinutes: "15"
  noshowPassengerDelayMinutes: "15"
  extra: {}

# Secrets should be provided via AWS Secrets Manager or external secret management
secrets:
  databaseUrl: ""
  redisUrl: ""
  fedapayApiUrl: ""
  fedapayApiKey: ""
  fedapayWebhookSecret: ""
  extra: {}

probes:
  enabled: true
  liveness:
    initialDelaySeconds: 15
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 200m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: true
  minAvailable: 1

nodeSelector: {}

tolerations: []

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - payment-service
          topologyKey: kubernetes.io/hostname

imagePullSecrets:
  - name: ghcr-secret
