apiVersion: v1
kind: Secret
metadata:
  name: {{ include "payment-service.fullname" . }}
  labels:
    {{- include "payment-service.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.secrets.databaseUrl }}
  DATABASE_URL: {{ .Values.secrets.databaseUrl | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.redisUrl }}
  REDIS_URL: {{ .Values.secrets.redisUrl | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.fedapaySandboxApiUrl }}
  FEDAPAY_SANDBOX_API_URL: {{ .Values.secrets.fedapaySandboxApiUrl | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.fedapaySandboxApiKey }}
  FEDAPAY_SANDBOX_API_KEY: {{ .Values.secrets.fedapaySandboxApiKey | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.fedapaySandboxWebhookSecret }}
  FEDAPAY_SANDBOX_WEBHOOK_SECRET: {{ .Values.secrets.fedapaySandboxWebhookSecret | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.fedapayLiveApiUrl }}
  FEDAPAY_LIVE_API_URL: {{ .Values.secrets.fedapayLiveApiUrl | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.fedapayLiveApiKey }}
  FEDAPAY_LIVE_API_KEY: {{ .Values.secrets.fedapayLiveApiKey | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.fedapayLiveWebhookSecret }}
  FEDAPAY_LIVE_WEBHOOK_SECRET: {{ .Values.secrets.fedapayLiveWebhookSecret | b64enc | quote }}
  {{- end }}
  {{- range $key, $value := .Values.secrets.extra }}
  {{ $key }}: {{ $value | b64enc | quote }}
  {{- end }}
