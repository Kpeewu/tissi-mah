syntax = "proto3";
package vehicle;
option go_package = "github.com/Kpeewu/tissi-mah/services/vehicle-service/proto/gen;vehicle";
import "google/api/annotations.proto";

// VehicleService gère la création, mise à jour, suppression et consultation des véhicules.
service VehicleService {
  // AddVehicle crée un nouveau véhicule pour un utilisateur.
  rpc AddVehicle(AddVehicleRequest) returns (AddVehicleResponse) {
    option (google.api.http) = { post: "/api/v1/vehicle/add" body: "*" };
  }
  // UpdateVehicle met à jour les informations modifiables d'un véhicule.
  rpc UpdateVehicle(UpdateVehicleRequest) returns (UpdateVehicleResponse) {
    option (google.api.http) = { patch: "/api/v1/vehicle/update" body: "*" };
  }
  // DeleteVehicle supprime un véhicule.
  rpc DeleteVehicle(DeleteVehicleRequest) returns (DeleteVehicleResponse) {
    option (google.api.http) = { post: "/api/v1/vehicle/delete" body: "*" };
  }
  // GetVehicleDetails retourne les détails complets d'un véhicule.
  rpc GetVehicleDetails(GetVehicleDetailsRequest) returns (GetVehicleDetailsResponse) {
    option (google.api.http) = { post: "/api/v1/vehicle/details" body: "*" };
  }
  // GetUserVehicles retourne la liste des véhicules d'un utilisateur.
  rpc GetUserVehicles(GetUserVehiclesRequest) returns (GetUserVehiclesResponse) {
    option (google.api.http) = { post: "/api/v1/vehicle/getUserVehicles" body: "*" };
  }
  // GetVehicleInfo retourne les informations essentielles d'un véhicule sans contrôle
  // de propriété ni chargement des documents (inter-service, appelé par file-service
  // et trips-service).
  rpc GetVehicleInfo(GetVehicleInfoRequest) returns (GetVehicleInfoResponse);
  // SetVehicleVerification fixe le flag is_verified d'un véhicule (inter-service,
  // appelé par kyc-service quand assurance + carte grise du véhicule sont toutes
  // deux approuvées — ou ne le sont plus). Pas d'annotation HTTP : jamais exposé.
  rpc SetVehicleVerification(SetVehicleVerificationRequest) returns (SetVehicleVerificationResponse);
  // Health retourne l'état de santé du service.
  rpc Health(HealthRequest) returns (HealthResponse) {
    option (google.api.http) = { get: "/api/v1/vehicle/health" };
  }
}

// AddVehicleRequest contient les informations nécessaires pour créer un véhicule.
message AddVehicleRequest {
  string UserId = 1;
  string Brand = 2;
  int32 NumberOfSeats = 3;
  string BrandModel = 4;
  string Color = 5;
  string LicencePlate = 6;
}

// AddVehicleResponse retourne l'identifiant du véhicule créé.
message AddVehicleResponse {
  string VehicleId = 1;
  string ErrorMessage = 2;
}

// UpdateVehicleRequest contient les champs modifiables d'un véhicule.
// Color et LicencePlate sont optionnels.
message UpdateVehicleRequest {
  string UserId = 1;
  string VehicleId = 2;
  string Color = 3;
  string LicencePlate = 4;
}

// UpdateVehicleResponse indique si la mise à jour a réussi.
message UpdateVehicleResponse {
  bool Success = 1;
  string ErrorMessage = 2;
}

// DeleteVehicleRequest identifie le véhicule à supprimer.
message DeleteVehicleRequest {
  string UserId = 1;
  string VehicleId = 2;
}

// DeleteVehicleResponse indique si la suppression a réussi.
message DeleteVehicleResponse {
  bool Success = 1;
  string ErrorMessage = 2;
}

// GetVehicleDetailsRequest identifie le véhicule dont on veut les détails.
message GetVehicleDetailsRequest {
  string UserId = 1;
  string VehicleId = 2;
}

// GetVehicleDetailsResponse retourne les détails complets d'un véhicule.
message GetVehicleDetailsResponse {
  VehicleDetail Vehicle = 1;
  string ErrorMessage = 2;
}

// GetUserVehiclesRequest identifie l'utilisateur dont on veut les véhicules.
message GetUserVehiclesRequest {
  string UserId = 1;
}

// GetUserVehiclesResponse retourne la liste des aperçus de véhicules.
message GetUserVehiclesResponse {
  repeated VehiclePreview Vehicles = 1;
  string ErrorMessage = 2;
}

message HealthRequest {}

// HealthResponse retourne l'état de santé du service.
message HealthResponse {
  string Status = 1;
  string Version = 2;
  int64 Timestamp = 3;
}

// VehicleDocuments contient les URLs et statuts des documents du véhicule.
message VehicleDocuments {
  reserved 3;
  reserved "DriverLicenceUrl";

  string AssuranceUrl              = 1;
  string VehicleRegistrationUrl    = 2;
  // Permis du conducteur (document utilisateur recto-verso, partagé entre tous ses véhicules)
  string DriverLicenceRectoUrl     = 6;
  string DriverLicenceVersoUrl     = 7;
  string AssuranceStatus           = 4;
  string VehicleRegistrationStatus = 5;
}

// VehicleDetail contient les informations complètes d'un véhicule.
message VehicleDetail {
  string VehicleId = 1;
  string UserId = 2;
  string Brand = 3;
  int32 NumberOfSeats = 4;
  string BrandModel = 5;
  string Color = 6;
  string LicencePlate = 7;
  bool IsVerified = 8;
  VehicleDocuments Documents = 9;
}

// VehiclePreview contient un aperçu réduit d'un véhicule pour les listes.
message VehiclePreview {
  string VehicleId                 = 1;
  string Brand                     = 2;
  string BrandModel                = 3;
  string LicencePlate              = 4;
  bool   IsVerified                = 5;
  int32  NumberOfSeats             = 6;
  string AssuranceStatus           = 7;
  string VehicleRegistrationStatus = 8;
  string DriverLicenceStatus       = 9;
  int32  TripCount                 = 10;
}

// GetVehicleInfoRequest identifie le véhicule dont on veut les infos essentielles.
message GetVehicleInfoRequest {
  string VehicleId = 1;
}

// GetVehicleInfoResponse retourne les infos essentielles d'un véhicule.
message GetVehicleInfoResponse {
  VehicleInfo Vehicle = 1;
  string ErrorMessage = 2;
}

// VehicleInfo contient les informations essentielles d'un véhicule (sans documents).
message VehicleInfo {
  string VehicleId = 1;
  string Brand = 2;
  string BrandModel = 3;
  string Color = 4;
  string LicencePlate = 5;
  int32 NumberOfSeats = 6;
  bool IsVerified = 7;
  string UserId = 8; // Propriétaire — pour les contrôles de propriété inter-service
}

// SetVehicleVerificationRequest fixe le flag de vérification d'un véhicule.
message SetVehicleVerificationRequest {
  string VehicleId = 1;
  bool IsVerified = 2;
}

// SetVehicleVerificationResponse indique si la mise à jour a réussi.
message SetVehicleVerificationResponse {
  bool Success = 1;
  string ErrorMessage = 2;
}
