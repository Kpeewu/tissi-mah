# VPS Development values for notification-service
# Namespace: default

replicaCount: 1

image:
  registry: ghcr.io
  repository: kpeewu/tissi-mah/notification-service
  pullPolicy: Always
  tag: "develop"

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "9090"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

service:
  type: ClusterIP
  port: 50060

config:
  environment: "development"
  logLevel: "debug"
  userServiceHost: "user-service"
  userServicePort: "50052"
  pushServiceHost: "push-service"
  pushServicePort: "50062"
  emailServiceHost: "email-service"
  emailServicePort: "50061"
  extra: {}

secrets:
  databaseUrl: ""
  redisUrl: ""
  extra: {}

probes:
  enabled: true
  liveness:
    initialDelaySeconds: 15
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

resources:
  limits:
    cpu: 300m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 80

podDisruptionBudget:
  enabled: false

nodeSelector: {}
tolerations: []
affinity: {}

imagePullSecrets:
  - name: ghcr-secret
