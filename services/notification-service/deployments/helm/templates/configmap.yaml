apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "notification-service.fullname" . }}
  labels:
    {{- include "notification-service.labels" . | nindent 4 }}
data:
  ENVIRONMENT: {{ .Values.config.environment | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  GRPC_PORT: {{ .Values.service.port | quote }}
  USER_SERVICE_HOST: {{ .Values.config.userServiceHost | quote }}
  USER_SERVICE_PORT: {{ .Values.config.userServicePort | quote }}
  PUSH_SERVICE_HOST: {{ .Values.config.pushServiceHost | quote }}
  PUSH_SERVICE_PORT: {{ .Values.config.pushServicePort | quote }}
  EMAIL_SERVICE_HOST: {{ .Values.config.emailServiceHost | quote }}
  EMAIL_SERVICE_PORT: {{ .Values.config.emailServicePort | quote }}
  {{- range $key, $value := .Values.config.extra }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
