replicaCount: 2

image:
  registry: ghcr.io
  repository: kpeewu/tissi-mah/support-service
  pullPolicy: Always
  tag: "staging"

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

service:
  type: ClusterIP
  port: 50063

config:
  environment: "staging"
  logLevel: "info"
  emailServiceHost: "email-service"
  emailServicePort: "50061"
  jwtTTLHours: "12"
  refreshTokenTTLHours: "720"
  otpTTLSeconds: "300"
  otpMaxAttempts: "3"
  otpResendCooldownSeconds: "300"
  loginFailThreshold: "5"
  loginFailWindowSeconds: "86400"
  frontendUrl: "https://staging.support.tissimah.com"
  passwordResetTtlSeconds: "3600"
  extra: {}

secrets:
  databaseUrl: ""
  redisUrl: ""
  jwtSecret: ""
  extra: {}

probes:
  enabled: true
  liveness:
    initialDelaySeconds: 15
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

resources:
  limits:
    cpu: 300m
    memory: 384Mi
  requests:
    cpu: 100m
    memory: 192Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 1

nodeSelector: {}
tolerations: []
affinity: {}

imagePullSecrets:
  - name: ghcr-secret
