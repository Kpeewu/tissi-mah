# Production values for kyc-service
# Namespace: production

replicaCount: 3

image:
  registry: ghcr.io
  repository: kpeewu/tissi-mah/kyc-service
  pullPolicy: Always
  tag: ""  # Set via CI/CD with semver tag

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations:
    eks.amazonaws.com/role-arn: ""  # Set via CI/CD
  name: ""

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "9090"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

service:
  type: ClusterIP
  port: 50057

config:
  environment: "production"
  logLevel: "warn"
  fileServiceHost: "file-service"
  fileServicePort: "50053"
  userServiceHost: "user-service"
  userServicePort: "50052"
  personaTemplateId: ""
  extra: {}

# Secrets MUST be provided via AWS Secrets Manager or external secret management
secrets:
  personaApiKey: ""
  personaWebhookSecret: ""
  extra: {}

probes:
  enabled: true
  liveness:
    initialDelaySeconds: 20
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 3
  readiness:
    initialDelaySeconds: 15
    periodSeconds: 15
    timeoutSeconds: 10
    failureThreshold: 3

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 60
  targetMemoryUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 2

nodeSelector: {}

tolerations: []

affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchExpressions:
            - key: app.kubernetes.io/name
              operator: In
              values:
                - kyc-service
        topologyKey: kubernetes.io/hostname

imagePullSecrets:
  - name: ghcr-secret
