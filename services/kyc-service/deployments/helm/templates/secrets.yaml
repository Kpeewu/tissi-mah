apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kyc-service.fullname" . }}
  labels:
    {{- include "kyc-service.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.secrets.personaApiKey }}
  PERSONA_API_KEY: {{ .Values.secrets.personaApiKey | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.personaWebhookSecret }}
  PERSONA_WEBHOOK_SECRET: {{ .Values.secrets.personaWebhookSecret | b64enc | quote }}
  {{- end }}
  {{- range $key, $value := .Values.secrets.extra }}
  {{ $key }}: {{ $value | b64enc | quote }}
  {{- end }}
