replicaCount: 1

image:
  repository: file-service
  pullPolicy: Never
  tag: "local"

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

service:
  type: ClusterIP
  port: 50053

config:
  environment: "local"
  logLevel: "debug"
  s3Region: "us-east-1"
  s3Bucket: "tissi-mah-files"
  s3Endpoint: "http://minio:9000"
  s3ForcePathStyle: "true"
  userServiceHost: "user-service"
  userServicePort: "50052"
  extra: {}

secrets:
  databaseUrl: "postgresql://dev:dev123@file-postgres:5432/file_db?sslmode=disable"
  redisUrl: "redis://file-redis:6379/0"
  s3AccessKey: "minioadmin"
  s3SecretKey: "minioadmin"
  extra: {}

probes:
  enabled: false
  liveness:
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 1
  targetCPUUtilizationPercentage: 80

podDisruptionBudget:
  enabled: false

nodeSelector: {}
tolerations: []
affinity: {}
imagePullSecrets: []
