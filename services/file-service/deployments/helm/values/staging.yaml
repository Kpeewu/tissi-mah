replicaCount: 2

image:
  registry: ghcr.io
  repository: kpeewu/tissi-mah/file-service
  pullPolicy: Always
  tag: "staging"

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations:
    eks.amazonaws.com/role-arn: ""
  name: ""

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "9090"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

service:
  type: ClusterIP
  port: 50053

config:
  environment: "staging"
  logLevel: "info"
  s3Region: ""
  s3Bucket: ""
  s3ForcePathStyle: "false"
  userServiceHost: "user-service"
  userServicePort: "50052"
  vehicleServiceHost: "vehicle-service"
  vehicleServicePort: "50055"
  extra: {}

secrets:
  databaseUrl: ""
  redisUrl: ""
  s3AccessKey: ""
  s3SecretKey: ""
  extra: {}

probes:
  enabled: true
  liveness:
    initialDelaySeconds: 15
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 200m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: true
  minAvailable: 1

nodeSelector: {}
tolerations: []

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - file-service
          topologyKey: kubernetes.io/hostname

imagePullSecrets:
  - name: ghcr-secret
