# Staging values for api-gateway
# Namespace: staging

replicaCount: 2

image:
  registry: ghcr.io
  repository: kpeewu/tissi-mah/api-gateway
  pullPolicy: Always
  tag: "staging"

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations:
    eks.amazonaws.com/role-arn: ""  # Set via CI/CD
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

service:
  type: LoadBalancer
  port: 8080

config:
  environment: "staging"
  logLevel: "info"
  authServiceHost: "auth-service"
  authServicePort: "50051"
  userServiceHost: "user-service"
  userServicePort: "50052"
  ratingServiceHost: "rating-service"
  ratingServicePort: "50054"
  corsAllowedOrigins: "https://staging.tissi-mah.com"
  extra: {}

secrets:
  redisUrl: ""
  firebaseProjectId: ""
  extra: {}

probes:
  enabled: true
  liveness:
    initialDelaySeconds: 10
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 200m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: true
  minAvailable: 1

nodeSelector: {}

tolerations: []

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - api-gateway
          topologyKey: kubernetes.io/hostname

imagePullSecrets:
  - name: ghcr-secret
