apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "api-gateway.fullname" . }}
  labels:
    {{- include "api-gateway.labels" . | nindent 4 }}
data:
  ENVIRONMENT: {{ .Values.config.environment | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  HTTP_PORT: {{ .Values.service.port | quote }}
  AUTH_SERVICE_HOST: {{ .Values.config.authServiceHost | quote }}
  AUTH_SERVICE_PORT: {{ .Values.config.authServicePort | quote }}
  USER_SERVICE_HOST: {{ .Values.config.userServiceHost | quote }}
  USER_SERVICE_PORT: {{ .Values.config.userServicePort | quote }}
  RATING_SERVICE_HOST: {{ .Values.config.ratingServiceHost | quote }}
  RATING_SERVICE_PORT: {{ .Values.config.ratingServicePort | quote }}
  FILE_SERVICE_HOST: {{ .Values.config.fileServiceHost | quote }}
  FILE_SERVICE_PORT: {{ .Values.config.fileServicePort | quote }}
  VEHICLE_SERVICE_HOST: {{ .Values.config.vehicleServiceHost | quote }}
  VEHICLE_SERVICE_PORT: {{ .Values.config.vehicleServicePort | quote }}
  TRIPS_SERVICE_HOST: {{ .Values.config.tripsServiceHost | quote }}
  TRIPS_SERVICE_PORT: {{ .Values.config.tripsServicePort | quote }}
  KYC_SERVICE_HOST: {{ .Values.config.kycServiceHost | quote }}
  KYC_SERVICE_PORT: {{ .Values.config.kycServicePort | quote }}
  BOOKING_SERVICE_HOST: {{ .Values.config.bookingServiceHost | quote }}
  BOOKING_SERVICE_PORT: {{ .Values.config.bookingServicePort | quote }}
  PAYMENT_SERVICE_HOST: {{ .Values.config.paymentServiceHost | quote }}
  PAYMENT_SERVICE_PORT: {{ .Values.config.paymentServicePort | quote }}
  NOTIF_SERVICE_HOST: {{ .Values.config.notifServiceHost | quote }}
  NOTIF_SERVICE_PORT: {{ .Values.config.notifServicePort | quote }}
  SUPPORT_SERVICE_HOST: {{ .Values.config.supportServiceHost | quote }}
  SUPPORT_SERVICE_PORT: {{ .Values.config.supportServicePort | quote }}
  GEOLOCATION_SERVICE_HOST: {{ .Values.config.geolocationServiceHost | quote }}
  GEOLOCATION_SERVICE_PORT: {{ .Values.config.geolocationServicePort | quote }}
  CORS_ALLOWED_ORIGINS: {{ .Values.config.corsAllowedOrigins | quote }}
  {{- range $key, $value := .Values.config.extra }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
