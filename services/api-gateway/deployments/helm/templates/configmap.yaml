apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "api-gateway.fullname" . }}
  labels:
    {{- include "api-gateway.labels" . | nindent 4 }}
data:
  ENVIRONMENT: {{ .Values.config.environment | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  HTTP_PORT: {{ .Values.service.port | quote }}
  AUTH_SERVICE_HOST: {{ .Values.config.authServiceHost | quote }}
  AUTH_SERVICE_PORT: {{ .Values.config.authServicePort | quote }}
  USER_SERVICE_HOST: {{ .Values.config.userServiceHost | quote }}
  USER_SERVICE_PORT: {{ .Values.config.userServicePort | quote }}
  RATING_SERVICE_HOST: {{ .Values.config.ratingServiceHost | quote }}
  RATING_SERVICE_PORT: {{ .Values.config.ratingServicePort | quote }}
  KYC_SERVICE_HOST: {{ .Values.config.kycServiceHost | quote }}
  KYC_SERVICE_PORT: {{ .Values.config.kycServicePort | quote }}
  CORS_ALLOWED_ORIGINS: {{ .Values.config.corsAllowedOrigins | quote }}
  {{- range $key, $value := .Values.config.extra }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
