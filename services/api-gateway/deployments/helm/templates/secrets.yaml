apiVersion: v1
kind: Secret
metadata:
  name: {{ include "api-gateway.fullname" . }}
  labels:
    {{- include "api-gateway.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.secrets.redisUrl }}
  REDIS_URL: {{ .Values.secrets.redisUrl | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.firebaseProjectId }}
  FIREBASE_PROJECT_ID: {{ .Values.secrets.firebaseProjectId | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.supportJwtSecret }}
  SUPPORT_JWT_SECRET: {{ .Values.secrets.supportJwtSecret | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.mobileAppIds }}
  MOBILE_APP_IDS: {{ .Values.secrets.mobileAppIds | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.supportAppIds }}
  SUPPORT_APP_IDS: {{ .Values.secrets.supportAppIds | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.internalHmacSecret }}
  INTERNAL_HMAC_SECRET: {{ .Values.secrets.internalHmacSecret | b64enc | quote }}
  {{- end }}
  {{- range $key, $value := .Values.secrets.extra }}
  {{ $key }}: {{ $value | b64enc | quote }}
  {{- end }}
