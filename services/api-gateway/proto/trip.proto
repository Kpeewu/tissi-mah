// CancelTrip
// =============================================================================

message CancelTripRequest {
  string DriverId           = 1;
  string TripId             = 2;
  string CancellationReason = 3;
}

message CancelTripResponse {
  bool   Success      = 1;
  string ErrorMessage = 2;
}

// =============================================================================
// CancelWaypoint
// =============================================================================

message CancelWaypointRequest {
  string DriverId           = 1;
  string WaypointId         = 2;
  string CancellationReason = 3;
}

message CancelWaypointResponse {
  bool   Success      = 1;
  string ErrorMessage = 2;
}

// =============================================================================
// Health
// =============================================================================

// =============================================================================
// GetScheduledTripsPreviews (recherche passager)
// =============================================================================

message GetScheduledTripsPreviewsRequest {
  double PassengerPositionLng  = 1;  // 0 = non renseigné
  double PassengerPositionLat  = 2;  // 0 = non renseigné
  int32  DistanceRange         = 3;  // km, défaut 5 si 0
  string DepartureLocationName = 4;  // recherche floue (obligatoire)
  string ArrivalLocationName   = 5;  // recherche floue (obligatoire)
  string TripStartDate         = 6;  // "YYYY-MM-DD" (UTC)
  string TripStartHour         = 7;  // "HH:MM" (UTC)
  string TripArrivalHour       = 8;  // "HH:MM" (UTC)
  int32  Index                 = 9;  // pagination 0-based
}

message GetScheduledTripsPreviewsResponse {
  repeated TripPreview TripsPreviews = 1;
  string ErrorMessage                = 2;
  int32  NextIndex                   = 3;  // -1 si plus de résultats
  int32  TotalCount                  = 4;  // nombre total de résultats matchant
}

// =============================================================================
// Health
// =============================================================================

message HealthRequest {}

message HealthResponse {
  string Status    = 1;
  string Version   = 2;
  int64  Timestamp = 3;
}

// =============================================================================
// IncrementLegBookedSeats (interne — appelé par booking-service)
// =============================================================================

message IncrementLegBookedSeatsRequest {
  string TripId    = 1;
  int32  FromOrder = 2; // sequencer_order du waypoint de départ (inclusif)
  int32  ToOrder   = 3; // sequencer_order du waypoint d'arrivée (exclusif)
  int32  Delta     = 4; // +N pour réservation, -N pour annulation
}

message IncrementLegBookedSeatsResponse {
  bool   Success      = 1;
  string ErrorMessage = 2;
}

// =============================================================================
// SyncLegBookedSeats (interne — appelé par le job de réconciliation)
// =============================================================================

message LegBookedSeatsEntry {
  int32 SequencerOrder = 1;
  int32 BookedSeats    = 2;
}

message SyncLegBookedSeatsRequest {
  string TripId                      = 1;
  repeated LegBookedSeatsEntry Legs  = 2;
}

message SyncLegBookedSeatsResponse {
  bool   Success      = 1;
  string ErrorMessage = 2;
}

// =============================================================================
// GetDriverTripDetails (conducteur — route protégée JWT)
// =============================================================================

message GetDriverTripDetailsRequest {
  string TripId = 1;
}

message DriverWaypointDetail {
  string WaypointId                    = 1;
  string WaypointType                  = 2;  // departure | stop | arrival
  int32  SequencerOrder                = 3;
  string LocationName                  = 4;
  double LocationLng                   = 5;
  double LocationLat                   = 6;
  string City                          = 7;
  string Country                       = 8;
  string ScheduledPickupDatetime       = 9;  // RFC3339
  string ActualArrivalDatetime         = 10; // RFC3339, vide si pas encore arrivé
  string ActualScheduledPickupDatetime = 11; // RFC3339, vide si pas encore parti
  int32  MinutesFromDeparture          = 12;
  int32  PriceFromPrevious             = 13;
  bool   IsCancelled                   = 14;
  string CancellationReason            = 15;
}

message GetDriverTripDetailsResponse {
  string TripId                            = 1;
  string DriverId                          = 2;
  string Status                            = 3;
  int32  TotalSeats                        = 4;
  int32  AvailableSeats                    = 5;
  int32  PricePerSeat                      = 6;
  bool   AutoApproveEnabled                = 7;
  string DepartureDatetime                 = 8;  // RFC3339
  string EstimatedArrivalDatetime          = 9;  // RFC3339
  string ActualDepartureDatetime           = 10; // RFC3339, vide si pas encore parti
  string ActualArrivalDatetime             = 11; // RFC3339, vide si pas encore arrivé
  int32  EstimatedDurationMinutes          = 12;
  int32  EstimatedDistanceMeters           = 13;
  string VehicleId                         = 14;
  string VehicleBrand                      = 15;
  string VehiclePlate                      = 16;
  repeated string PaymentMethodsAccepted   = 17;
  bool   AllowLuggages                     = 18;
  bool   AllowPets                         = 19;
  bool   AllowFood                         = 20;
  bool   AllowSmoking                      = 21;
  string Description                       = 22;
  repeated DriverWaypointDetail Waypoints  = 23;
  string ErrorMessage                      = 24;
  repeated DriverBookingPreview Bookings   = 25; // réservations sur ce trajet
  string RoutePolyline                     = 26; // Google encoded polyline du tracé
}

// DriverBookingPreview contient les informations résumées d'une réservation pour le conducteur.
message DriverBookingPreview {
  string BookingId           = 1;
  string BookingReference    = 2;
  string Status              = 3;  // pending | approved | rejected | cancelled | inProgress | completed
  int32  SeatsBooked         = 4;
  int32  TotalAmount         = 5;
  string PickupLocationName  = 6;
  string DropoffLocationName = 7;
}

// =============================================================================
// GetPassengerTripDetails (passager — route publique)
// =============================================================================

message GetPassengerTripDetailsRequest {
  string TripId = 1;
}

message PassengerWaypointDetail {
  string WaypointId              = 1;
  string WaypointType            = 2;  // departure | stop | arrival
  int32  SequencerOrder          = 3;
  string LocationName            = 4;
  string City                    = 5;
  string ScheduledPickupDatetime = 6;  // RFC3339
  int32  PriceFromPrevious       = 7;
  int32  MinutesFromDeparture    = 8;
  bool   IsCancelled             = 9;  // true si le waypoint a été annulé
}

message GetPassengerTripDetailsResponse {
  string TripId                              = 1;
  string DriverId                            = 2;
  string DriverName                          = 3;
  string DriverProfileImageURL               = 4;
  double DriverRatingAverage                 = 5;
  string Status                              = 6;
  int32  TotalSeats                          = 7;
  int32  AvailableSeats                      = 8;
  int32  PricePerSeat                        = 9;
  string DepartureDatetime                   = 10; // RFC3339
  string EstimatedArrivalDatetime            = 11; // RFC3339
  int32  EstimatedDurationMinutes            = 12;
  string VehicleId                           = 13;
  string VehicleBrand                        = 14;
  string VehiclePlate                        = 15;
  repeated string PaymentMethodsAccepted     = 16;
  bool   AllowLuggages                       = 17;
  bool   AllowPets                           = 18;
  bool   AllowFood                           = 19;
  bool   AllowSmoking                        = 20;
  string Description                         = 21;
  repeated PassengerWaypointDetail Waypoints = 22;
  string ErrorMessage                        = 23;
  string RoutePolyline                       = 24; // Google encoded polyline du tracé
  int32  EstimatedDistanceMeters             = 25;
}

// =============================================================================
// CheckDeletionEligibility / AnonymizeUserData — suppression de compte
// =============================================================================

message CheckDeletionEligibilityRequest {
  string UserId = 1; // UserID interne (user-service)
}

message CheckDeletionEligibilityResponse {
  bool   CanDelete       = 1;
  string BlockingReason  = 2; // vide si CanDelete = true
  string ErrorMessage    = 3;
}

message AnonymizeUserDataRequest {
  string UserId = 1; // UserID interne (user-service)
}

message AnonymizeUserDataResponse {
  bool   Success      = 1;
  string ErrorMessage = 2;
}
