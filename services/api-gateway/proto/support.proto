syntax = "proto3";

package support;

option go_package = "github.com/Kpeewu/tissi-mah/services/api-gateway/proto/gen/supportpb;supportpb";

import "google/api/annotations.proto";

service SupportService {
  rpc Login(LoginRequest) returns (LoginResponse) {
    option (google.api.http) = {
      post: "/api/v1/support/login"
      body: "*"
    };
  }

  rpc VerifyOTP(VerifyOTPRequest) returns (VerifyOTPResponse) {
    option (google.api.http) = {
      post: "/api/v1/support/verifyOtp"
      body: "*"
    };
  }

  rpc ResendOTP(ResendOTPRequest) returns (ResendOTPResponse) {
    option (google.api.http) = {
      post: "/api/v1/support/resendOtp"
      body: "*"
    };
  }

  rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse) {
    option (google.api.http) = {
      post: "/api/v1/support/refreshToken"
      body: "*"
    };
  }

  rpc Logout(LogoutRequest) returns (LogoutResponse) {
    option (google.api.http) = {
      post: "/api/v1/support/logout"
      body: "*"
    };
  }

  rpc Me(MeRequest) returns (MeResponse) {
    option (google.api.http) = {
      get: "/api/v1/support/me"
    };
  }

  rpc ChangeMyPassword(ChangeMyPasswordRequest) returns (ChangeMyPasswordResponse) {
    option (google.api.http) = {
      post: "/api/v1/support/me/password"
      body: "*"
    };
  }

  rpc ChangeMyEmail(ChangeMyEmailRequest) returns (ChangeMyEmailResponse) {
    option (google.api.http) = {
      post: "/api/v1/support/me/email"
      body: "*"
    };
  }

  rpc CreateSupportAgent(CreateSupportAgentRequest) returns (CreateSupportAgentResponse) {
    option (google.api.http) = {
      post: "/api/v1/support/admin/agents"
      body: "*"
    };
  }

  rpc ListSupportAgents(ListSupportAgentsRequest) returns (ListSupportAgentsResponse) {
    option (google.api.http) = {
      get: "/api/v1/support/admin/agents"
    };
  }

  rpc DeactivateSupportAgent(DeactivateSupportAgentRequest) returns (DeactivateSupportAgentResponse) {
    option (google.api.http) = {
      post: "/api/v1/support/admin/agents/deactivate"
      body: "*"
    };
  }

  rpc ActivateSupportAgent(ActivateSupportAgentRequest) returns (ActivateSupportAgentResponse) {
    option (google.api.http) = {
      post: "/api/v1/support/admin/agents/activate"
      body: "*"
    };
  }

  // DeleteSupportAgent supprime (soft-delete) un agent. Seul un compte déjà
  // désactivé peut être supprimé.
  rpc DeleteSupportAgent(DeleteSupportAgentRequest) returns (DeleteSupportAgentResponse) {
    option (google.api.http) = {
      post: "/api/v1/support/admin/agents/delete"
      body: "*"
    };
  }

  rpc Health(HealthRequest) returns (HealthResponse) {
    option (google.api.http) = {
      get: "/api/v1/support/health"
    };
  }

  // GetSupportUserByID est un RPC inter-service (gRPC uniquement, pas d'annotation HTTP).
  // Utilisé par payment-service pour vérifier l'identité et l'habilitation d'un agent support.
  rpc GetSupportUserByID(GetSupportUserByIDRequest) returns (GetSupportUserByIDResponse);
}

message LoginRequest {
  string Email    = 1;
  string Password = 2;
}

message LoginResponse {
  string OtpSessionId      = 1;
  int32  ExpiresInSeconds  = 2;
}

message VerifyOTPRequest {
  string OtpSessionId = 1;
  string Code         = 2;
}

message VerifyOTPResponse {
  string AccessToken        = 1;
  int64  AccessExpiresAt    = 2;
  string RefreshToken       = 3;
  int64  RefreshExpiresAt   = 4;
  string Role               = 5;
  bool   MustChangePassword = 6;
}

message ResendOTPRequest {
  string OtpSessionId = 1;
}

message ResendOTPResponse {
  string OtpSessionId     = 1;
  int32  ExpiresInSeconds = 2;
}

message RefreshTokenRequest {
  string RefreshToken = 1;
}

message RefreshTokenResponse {
  string AccessToken      = 1;
  int64  AccessExpiresAt  = 2;
  string RefreshToken     = 3;
  int64  RefreshExpiresAt = 4;
}

message LogoutRequest {
  string RefreshToken = 1;
}

message LogoutResponse {}

message MeRequest {}

message MeResponse {
  string UserId             = 1;
  string Email              = 2;
  string FirstName          = 3;
  string LastName           = 4;
  string Role               = 5;
  bool   MustChangePassword = 6;
  int64  CreatedAt          = 7;
}

message ChangeMyPasswordRequest {
  string CurrentPassword = 1;
  string NewPassword     = 2;
}

message ChangeMyPasswordResponse {}

message ChangeMyEmailRequest {
  string NewEmail         = 1;
  string CurrentPassword  = 2;
}

message ChangeMyEmailResponse {}

message CreateSupportAgentRequest {
  string Email     = 1;
  string FirstName = 2;
  string LastName  = 3;
  // Role du nouvel agent : "admin" ou "support". Vide = "support" par défaut.
  string Role      = 4;
}

message CreateSupportAgentResponse {
  string UserId = 1;
}

message ListSupportAgentsRequest {
  int32 Limit  = 1;
  int32 Offset = 2;
}

message SupportAgent {
  string UserId     = 1;
  string Email      = 2;
  string FirstName  = 3;
  string LastName   = 4;
  string Role       = 5;
  bool   IsActive   = 6;
  int64  CreatedAt  = 7;
}

message ListSupportAgentsResponse {
  repeated SupportAgent Agents = 1;
  int32                 Total  = 2;
}

message DeactivateSupportAgentRequest {
  string UserId = 1;
}

message DeactivateSupportAgentResponse {}

message ActivateSupportAgentRequest {
  string UserId = 1;
}

message ActivateSupportAgentResponse {}

message DeleteSupportAgentRequest {
  string UserId = 1;
}

message DeleteSupportAgentResponse {}

message HealthRequest {}

message HealthResponse {
  string Status  = 1;
  string Version = 2;
  string Service = 3;
}

message GetSupportUserByIDRequest {
  string UserId = 1;
}

message GetSupportUserByIDResponse {
  string UserId    = 1;
  string FirstName = 2;
  string LastName  = 3;
  string Role      = 4;
  bool   IsActive  = 5;
}
