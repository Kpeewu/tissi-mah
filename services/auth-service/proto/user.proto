// User Service Proto — contrat utilisé par auth-service
// Définit uniquement les RPCs dont auth-service a besoin.
// L'implémentation complète sera dans services/user-service.

syntax = "proto3";

package user;

option go_package = "github.com/Kpeewu/tissi-mah/services/auth-service/proto/gen/userpb;userpb";

// =============================================================================
// User Service
// =============================================================================

service UserService {
  // Crée un nouveau profil utilisateur après création du compte auth
  rpc CreateUser(CreateUserRequest) returns (UserProfileResponse);

  // Récupère le profil utilisateur lié à un AuthID
  rpc GetUserByAuthID(GetUserByAuthIDRequest) returns (UserProfileResponse);
}

// =============================================================================
// Request Messages
// =============================================================================

message CreateUserRequest {
  string AuthID          = 1;
  string Name            = 2;
  string FirstName       = 3;
  string ProfilePhotoURL = 4; // optionnel
  string FirebaseID      = 5;
}

message GetUserByAuthIDRequest {
  string AuthID = 1;
}

// =============================================================================
// Response Messages
// =============================================================================

// TripPreference — préférence de trajet individuelle
message TripPreference {
  string Preference = 1;
  bool   IsAllowed  = 2;
}

message UserProfileResponse {
  string UserID                              = 1;
  string AuthID                              = 2;
  string Name                                = 3;
  string FirstName                           = 4;
  string Gender                              = 5;
  string DateOfBirth                         = 6;
  string Bio                                 = 7;
  bool   HasProfileImage                     = 8;
  string ProfileImageURL                     = 9;
  bool   IsDriver                            = 10;
  bool   IsPassenger                         = 11;
  bool   IsDriverProfileVerified             = 12;
  bool   IsPassengerProfileVerified          = 13;
  repeated TripPreference TripPreferences    = 14;
  string IDCardExpirationDate                = 15;
  string DriveLicenceExpirationDate          = 16;
}
