# VPS Development values for user-service
# Namespace: dev

replicaCount: 1

image:
  registry: ghcr.io
  repository: kpeewu/tissi-mah/user-service
  pullPolicy: Always
  tag: "develop"

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "9090"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

service:
  type: ClusterIP
  port: 50052

config:
  environment: "development"
  logLevel: "debug"
  authServiceHost: "auth-service"
  authServicePort: "50051"
  fileServiceHost: "file-service"
  fileServicePort: "50053"
  mongodbDatabase: "user_db"
  extra: {}

secrets:
  mongodbUrl: ""
  redisUrl: ""
  extra: {}

probes:
  enabled: true
  liveness:
    initialDelaySeconds: 15
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

resources:
  limits:
    cpu: 300m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 80

podDisruptionBudget:
  enabled: false

nodeSelector: {}
tolerations: []
affinity: {}

imagePullSecrets:
  - name: ghcr-secret
