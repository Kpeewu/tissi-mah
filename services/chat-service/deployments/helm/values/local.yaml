replicaCount: 1

image:
  registry: ""
  repository: chat-service
  pullPolicy: IfNotPresent
  tag: "latest"

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext: {}
securityContext: {}

service:
  type: ClusterIP
  port: 50065

config:
  environment: "local"
  logLevel: "debug"
  bookingServiceHost: "booking-service"
  bookingServicePort: "50058"
  tripsServiceHost: "trips-service"
  tripsServicePort: "50055"
  supportServiceHost: "support-service"
  supportServicePort: "50063"
  tripCloserIntervalSeconds: "30"
  messageRetentionDays: "180"
  extra: {}

secrets:
  databaseUrl: "postgresql://dev:dev123@chat-postgres:5432/chat_db?sslmode=disable"
  redisUrl: "redis://chat-redis:6379/0"
  # Generer en local : openssl rand -base64 32
  chatEncryptionKey: ""
  extra: {}

probes:
  enabled: false
  liveness:
    initialDelaySeconds: 10
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: false

podDisruptionBudget:
  enabled: false

nodeSelector: {}
tolerations: []
affinity: {}

imagePullSecrets: []
