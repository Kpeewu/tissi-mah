replicaCount: 3

image:
  registry: ghcr.io
  repository: kpeewu/tissi-mah/chat-service
  pullPolicy: Always
  tag: ""

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations:
    eks.amazonaws.com/role-arn: ""  # Set via CI/CD
  name: ""

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "9090"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

service:
  type: ClusterIP
  port: 50065

config:
  environment: "production"
  logLevel: "warn"
  bookingServiceHost: "booking-service"
  bookingServicePort: "50058"
  tripsServiceHost: "trips-service"
  tripsServicePort: "50055"
  supportServiceHost: "support-service"
  supportServicePort: "50063"
  tripCloserIntervalSeconds: "30"
  messageRetentionDays: "180"
  extra: {}

# CHAT_ENCRYPTION_KEY MUST be provided via AWS Secrets Manager (External Secrets).
# Once set, ne JAMAIS le changer sans re-chiffrer les messages existants — sinon
# les conversations historiques deviennent illisibles meme pour le support.
secrets:
  databaseUrl: ""
  redisUrl: ""
  chatEncryptionKey: ""
  extra: {}

probes:
  enabled: true
  liveness:
    initialDelaySeconds: 20
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 3
  readiness:
    initialDelaySeconds: 15
    periodSeconds: 15
    timeoutSeconds: 10
    failureThreshold: 3

resources:
  requests:
    cpu: 300m
    memory: 384Mi
  limits:
    cpu: 1000m
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 60
  targetMemoryUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 2

nodeSelector: {}
tolerations: []

affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchExpressions:
            - key: app.kubernetes.io/name
              operator: In
              values:
                - chat-service
        topologyKey: kubernetes.io/hostname

imagePullSecrets:
  - name: ghcr-secret
