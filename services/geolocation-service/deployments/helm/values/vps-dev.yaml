# VPS Development values for geolocation-service
# Namespace: dev

# Baseline répliquas avant que l'HPA ne prenne le relais.
replicaCount: 3

image:
  registry: ghcr.io
  repository: kpeewu/tissi-mah/geolocation-service
  pullPolicy: Always
  tag: "develop"

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "9090"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

service:
  type: ClusterIP
  port: 50064

config:
  environment: "development"
  logLevel: "debug"
  # OSRM et Nominatim sont des Services internes du même cluster.
  osrmUrl: "http://osrm-backend:5000"
  nominatimUrl: "http://nominatim-backend:7070"
  geocodeDefaultCountries: "tg,gh,bj,bf"
  extra: {}

# Secrets — REDIS_URL doit être fourni via external secret management.
secrets:
  redisUrl: ""
  extra: {}

probes:
  enabled: true
  liveness:
    initialDelaySeconds: 15
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

# Resources — service stateless, charge légère par pod.
resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 512Mi

# HPA — couche 1 du plan de protection (cf. plan d'implémentation).
# Min 3, max 10, scale-up agressif (30s), scale-down lissé (5min) pour éviter le yo-yo.
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30

# PDB — toujours 2 pods up pendant drain / rolling update.
podDisruptionBudget:
  enabled: true
  minAvailable: 2

nodeSelector: {}
tolerations: []

# Anti-affinity : étaler les pods sur des nodes différents quand possible.
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: geolocation-service
          topologyKey: kubernetes.io/hostname

imagePullSecrets:
  - name: ghcr-secret
