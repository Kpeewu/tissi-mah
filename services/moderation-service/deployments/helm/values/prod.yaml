replicaCount: 3

image:
  registry: ghcr.io
  repository: kpeewu/tissi-mah/moderation-service
  pullPolicy: Always
  tag: ""

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations:
    eks.amazonaws.com/role-arn: ""  # Set via CI/CD
  name: ""

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "9090"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

service:
  type: ClusterIP
  port: 50066

config:
  environment: "production"
  logLevel: "warn"
  userServiceHost: "user-service"
  userServicePort: "50052"
  authServiceHost: "auth-service"
  authServicePort: "50051"
  textBlockedThreshold: "0.90"
  textFlaggedThreshold: "0.70"
  # fail-closed en prod : bloque si l'API de modération est indisponible
  # plutôt que de laisser passer du contenu potentiellement problématique
  failClosed: "true"
  extra: {}

# OPENAI_API_KEY, SIGHTENGINE_API_USER et SIGHTENGINE_API_SECRET
# DOIVENT être provisionnés via AWS Secrets Manager (External Secrets).
# Sans ces clés, seul le filtre local FR/EN/DE/IT/ES est actif.
secrets:
  databaseUrl: ""
  openaiApiKey: ""
  sightengineApiUser: ""
  sightengineApiSecret: ""
  extra: {}

probes:
  enabled: true
  liveness:
    initialDelaySeconds: 20
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 3
  readiness:
    initialDelaySeconds: 15
    periodSeconds: 15
    timeoutSeconds: 10
    failureThreshold: 3

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 768Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 8
  targetCPUUtilizationPercentage: 60
  targetMemoryUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 2

nodeSelector: {}
tolerations: []

affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchExpressions:
            - key: app.kubernetes.io/name
              operator: In
              values:
                - moderation-service
        topologyKey: kubernetes.io/hostname

imagePullSecrets:
  - name: ghcr-secret
