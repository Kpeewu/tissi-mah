replicaCount: 1

image:
  registry: ghcr.io
  repository: kpeewu/tissi-mah/moderation-service
  pullPolicy: IfNotPresent
  tag: ""

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podSecurityContext: {}
securityContext: {}

service:
  type: ClusterIP
  port: 50066

config:
  environment: "local"
  logLevel: "debug"
  userServiceHost: "user-service"
  userServicePort: "50052"
  authServiceHost: "auth-service"
  authServicePort: "50051"
  textBlockedThreshold: "0.90"
  textFlaggedThreshold: "0.70"
  failClosed: "false"
  extra: {}

secrets:
  databaseUrl: "postgresql://dev:dev123@localhost:5443/moderation_db?sslmode=disable"
  perspectiveApiKey: ""
  googleAppCredentials: ""
  extra: {}

probes:
  enabled: false
  liveness:
    initialDelaySeconds: 10
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    initialDelaySeconds: 5
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 3

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 1
  targetCPUUtilizationPercentage: 80

podDisruptionBudget:
  enabled: false
  minAvailable: 1

nodeSelector: {}
tolerations: []
affinity: {}

imagePullSecrets:
  - name: ghcr-secret
