replicaCount: 2

image:
  registry: ghcr.io
  repository: kpeewu/tissi-mah/moderation-service
  pullPolicy: Always
  tag: ""

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations:
    eks.amazonaws.com/role-arn: ""  # Set via CI/CD
  name: ""

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "9090"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

service:
  type: ClusterIP
  port: 50066

config:
  environment: "staging"
  logLevel: "info"
  userServiceHost: "user-service"
  userServicePort: "50052"
  authServiceHost: "auth-service"
  authServicePort: "50051"
  textBlockedThreshold: "0.90"
  textFlaggedThreshold: "0.70"
  # fail-closed en staging : bloque si API externe down pour tester le comportement prod
  failClosed: "true"
  extra: {}

# Secrets fournis via External Secrets Operator (AWS Secrets Manager)
secrets:
  databaseUrl: ""
  openaiApiKey: ""
  sightengineApiUser: ""
  sightengineApiSecret: ""
  extra: {}

probes:
  enabled: true
  liveness:
    initialDelaySeconds: 20
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 3
  readiness:
    initialDelaySeconds: 15
    periodSeconds: 15
    timeoutSeconds: 10
    failureThreshold: 3

resources:
  requests:
    cpu: 150m
    memory: 192Mi
  limits:
    cpu: 600m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 75

podDisruptionBudget:
  enabled: true
  minAvailable: 1

nodeSelector: {}
tolerations: []

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - moderation-service
          topologyKey: kubernetes.io/hostname

imagePullSecrets:
  - name: ghcr-secret
