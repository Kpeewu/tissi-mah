apiVersion: v1
kind: Secret
metadata:
  name: {{ include "moderation-service.fullname" . }}
  labels:
    {{- include "moderation-service.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.secrets.databaseUrl }}
  DATABASE_URL: {{ .Values.secrets.databaseUrl | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.openaiApiKey }}
  OPENAI_API_KEY: {{ .Values.secrets.openaiApiKey | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.sightengineApiUser }}
  SIGHTENGINE_API_USER: {{ .Values.secrets.sightengineApiUser | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.sightengineApiSecret }}
  SIGHTENGINE_API_SECRET: {{ .Values.secrets.sightengineApiSecret | b64enc | quote }}
  {{- end }}
  {{- range $key, $value := .Values.secrets.extra }}
  {{ $key }}: {{ $value | b64enc | quote }}
  {{- end }}
