apiVersion: v1
kind: Secret
metadata:
  name: {{ include "moderation-service.fullname" . }}
  labels:
    {{- include "moderation-service.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.secrets.databaseUrl }}
  DATABASE_URL: {{ .Values.secrets.databaseUrl | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.perspectiveApiKey }}
  PERSPECTIVE_API_KEY: {{ .Values.secrets.perspectiveApiKey | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.googleAppCredentials }}
  GOOGLE_APPLICATION_CREDENTIALS: {{ .Values.secrets.googleAppCredentials | b64enc | quote }}
  {{- end }}
  {{- range $key, $value := .Values.secrets.extra }}
  {{ $key }}: {{ $value | b64enc | quote }}
  {{- end }}
