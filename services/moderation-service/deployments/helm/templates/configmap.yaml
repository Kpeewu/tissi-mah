apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "moderation-service.fullname" . }}
  labels:
    {{- include "moderation-service.labels" . | nindent 4 }}
data:
  ENVIRONMENT: {{ .Values.config.environment | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  GRPC_PORT: {{ .Values.service.port | quote }}
  USER_SERVICE_HOST: {{ .Values.config.userServiceHost | quote }}
  USER_SERVICE_PORT: {{ .Values.config.userServicePort | quote }}
  AUTH_SERVICE_HOST: {{ .Values.config.authServiceHost | quote }}
  AUTH_SERVICE_PORT: {{ .Values.config.authServicePort | quote }}
  TEXT_BLOCKED_THRESHOLD: {{ .Values.config.textBlockedThreshold | quote }}
  TEXT_FLAGGED_THRESHOLD: {{ .Values.config.textFlaggedThreshold | quote }}
  MODERATION_FAIL_CLOSED: {{ .Values.config.failClosed | quote }}
  {{- range $key, $value := .Values.config.extra }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
