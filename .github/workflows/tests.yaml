name: Tests

on:
  workflow_call: # Appelé par deploy-to-vps.yml avant le build
  pull_request:
    branches: [develop]
    paths:
      - "services/**"
      - "pkg/**"
      - "go.work"

jobs:
  # Job pour détecter quels services ont changé
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      auth-service: ${{ steps.filter.outputs.auth-service }}
      file-service: ${{ steps.filter.outputs.file-service }}
      rating-service: ${{ steps.filter.outputs.rating-service }}
      booking-service: ${{ steps.filter.outputs.booking-service }}
      payment-service: ${{ steps.filter.outputs.payment-service }}
      trips-service: ${{ steps.filter.outputs.trips-service }}
      user-service: ${{ steps.filter.outputs.user-service }}
      email-service: ${{ steps.filter.outputs.email-service }}
      push-service: ${{ steps.filter.outputs.push-service }}
      notification-service: ${{ steps.filter.outputs.notification-service }}
      geolocation-service: ${{ steps.filter.outputs.geolocation-service }}
      chat-service: ${{ steps.filter.outputs.chat-service }}
      moderation-service: ${{ steps.filter.outputs.moderation-service }}
      pkg-notification: ${{ steps.filter.outputs.pkg-notification }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            auth-service:
              - 'services/auth-service/**'
            file-service:
              - 'services/file-service/**'
            rating-service:
              - 'services/rating-service/**'
            booking-service:
              - 'services/booking-service/**'
            payment-service:
              - 'services/payment-service/**'
            trips-service:
              - 'services/trips-service/**'
            user-service:
              - 'services/user-service/**'
            email-service:
              - 'services/email-service/**'
            push-service:
              - 'services/push-service/**'
            notification-service:
              - 'services/notification-service/**'
            geolocation-service:
              - 'services/geolocation-service/**'
            chat-service:
              - 'services/chat-service/**'
            moderation-service:
              - 'services/moderation-service/**'
            pkg-notification:
              - 'pkg/notification/**'

  # Test Auth Service
  test-auth-service:
    name: Test Auth Service
    needs: detect-changes
    if: needs.detect-changes.outputs.auth-service == 'true'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.work"
          cache: true
          cache-dependency-path: services/auth-service/go.sum

      - name: Download dependencies
        working-directory: services/auth-service
        run: go mod download

      - name: Run unit tests
        working-directory: services/auth-service
        env:
          DATABASE_URL: postgresql://testuser:testpassword@localhost:5432/testdb?sslmode=disable
        run: |
          go test -v -race -coverprofile=coverage.out -covermode=atomic ./tests/unit/...

      - name: Run integration tests
        working-directory: services/auth-service
        env:
          DATABASE_URL: postgresql://testuser:testpassword@localhost:5432/testdb?sslmode=disable
        run: |
          go test -v -race ./tests/integration/...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          file: services/auth-service/coverage.out
          flags: auth-service
          name: auth-service-coverage

