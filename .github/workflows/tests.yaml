        test-moderation-service,
        test-chat-service,
      ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check test results
        run: |
          echo "🧪 Test Results Summary"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          if [ "${{ needs.test-auth-service.result }}" == "success" ] || [ "${{ needs.detect-changes.outputs.auth-service }}" != "true" ]; then
            echo "✅ Auth Service: PASSED"
          else
            echo "❌ Auth Service: FAILED"
            exit 1
          fi

          if [ "${{ needs.test-file-service.result }}" == "success" ] || [ "${{ needs.detect-changes.outputs.file-service }}" != "true" ]; then
