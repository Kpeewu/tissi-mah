name: Deploy to VPS (Development)

on:
  push:
    branches: [develop]
    paths:
      - "services/**"
      - "pkg/**"
      - "go.work"
      - ".github/workflows/deploy-to-vps.yml"
  workflow_dispatch:
    inputs:
      service:
        description: "Service to deploy (leave empty for auto-detect)"
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-vps-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}
  DEPLOY_NAMESPACE: default

jobs:
  detect-changes:
    name: Set Services
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.set-services.outputs.services }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: dorny/paths-filter@v3
        if: github.event.inputs.service == ''
        id: filter
        with:
          filters: |
            api-gateway:
              - 'services/api-gateway/**'
            auth-service:
              - 'services/auth-service/**'
            user-service:
              - 'services/user-service/**'
            file-service:
              - 'services/file-service/**'
            rating-service:
              - 'services/rating-service/**'
            vehicle-service:
              - 'services/vehicle-service/**'
            trips-service:
              - 'services/trips-service/**'
            booking-service:
              - 'services/booking-service/**'
            kyc-service:
              - 'services/kyc-service/**'
            payment-service:
              - 'services/payment-service/**'
            pkg:
              - 'pkg/**'

      - name: Set services to deploy
        id: set-services
        run: |
          if [ -n "${{ github.event.inputs.service }}" ]; then
            echo "services=[\"${{ github.event.inputs.service }}\"]" >> $GITHUB_OUTPUT
          else
            echo 'services=["api-gateway","auth-service","user-service","file-service","rating-service","vehicle-service","trips-service","booking-service","kyc-service","payment-service"]' >> $GITHUB_OUTPUT
          fi

  build-and-push:
    name: Build and Push
    needs: detect-changes
    if: needs.detect-changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}
          tags: |
            type=raw,value=develop-${{ github.sha }}
            type=raw,value=develop-latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/deployments/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=develop-${{ github.sha }}
            COMMIT_SHA=${{ github.sha }}

  deploy:
    name: Deploy to VPS
    needs: [detect-changes, build-and-push]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.13.0"

      - name: Setup kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.VPS_KUBECONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Create secrets override file
        env:
          # api-gateway secrets (Firebase credentials shared with auth)
          GW_REDIS_URL: ${{ secrets.GW_REDIS_URL }}
          FIREBASE_CREDENTIALS: ${{ secrets.AUTH_FIREBASE_CREDENTIALS }}
          FIREBASE_PROJECT_ID: ${{ secrets.AUTH_FIREBASE_PROJECT_ID }}
          # auth-service secrets
          AUTH_DATABASE_URL: ${{ secrets.AUTH_DATABASE_URL }}
          AUTH_REDIS_URL: ${{ secrets.AUTH_REDIS_URL }}
          # user-service secrets
          USER_MONGODB_URL: ${{ secrets.USER_MONGODB_URL }}
          USER_REDIS_URL: ${{ secrets.USER_REDIS_URL }}
          # file-service secrets
          FILE_DATABASE_URL: ${{ secrets.FILE_DATABASE_URL }}
          FILE_REDIS_URL: ${{ secrets.FILE_REDIS_URL }}
          FILE_S3_ACCESS_KEY: ${{ secrets.FILE_S3_ACCESS_KEY }}
          FILE_S3_SECRET_KEY: ${{ secrets.FILE_S3_SECRET_KEY }}
          FILE_S3_ENDPOINT: ${{ secrets.FILE_S3_ENDPOINT }}
          # rating-service secrets
          RATING_DATABASE_URL: ${{ secrets.RATING_DATABASE_URL }}
          RATING_REDIS_URL: ${{ secrets.RATING_REDIS_URL }}
          # vehicle-service secrets
          VEHICLE_DATABASE_URL: ${{ secrets.VEHICLE_DATABASE_URL }}
          VEHICLE_REDIS_URL: ${{ secrets.VEHICLE_REDIS_URL }}
          # trips-service secrets
          TRIPS_DATABASE_URL: ${{ secrets.TRIPS_DATABASE_URL }}
          TRIPS_REDIS_URL: ${{ secrets.TRIPS_REDIS_URL }}
          # booking-service secrets
          BOOKING_DATABASE_URL: ${{ secrets.BOOKING_DATABASE_URL }}
          BOOKING_REDIS_URL: ${{ secrets.BOOKING_REDIS_URL }}
          # payment-service secrets
          PAYMENT_DATABASE_URL: ${{ secrets.PAYMENT_DATABASE_URL }}
          PAYMENT_REDIS_URL: ${{ secrets.PAYMENT_REDIS_URL }}
          PAYMENT_FEDAPAY_API_URL: ${{ secrets.PAYMENT_FEDAPAY_API_URL }}
          PAYMENT_FEDAPAY_API_KEY: ${{ secrets.PAYMENT_FEDAPAY_API_KEY }}
          PAYMENT_FEDAPAY_WEBHOOK_SECRET: ${{ secrets.PAYMENT_FEDAPAY_WEBHOOK_SECRET }}
          # kyc-service secrets
          KYC_PERSONA_API_KEY: ${{ secrets.KYC_PERSONA_API_KEY }}
          KYC_PERSONA_WEBHOOK_SECRET: ${{ secrets.KYC_PERSONA_WEBHOOK_SECRET }}
        run: |
          python3 - <<'PYEOF'
          import yaml, os, json, sys

          service = "${{ matrix.service }}"

          if service == "api-gateway":
              firebase_creds = os.environ.get('FIREBASE_CREDENTIALS', '').strip()
              if firebase_creds:
                  try:
                      firebase_creds = json.dumps(json.loads(firebase_creds))
                  except json.JSONDecodeError as e:
                      print(f"ERROR: FIREBASE_CREDENTIALS is not valid JSON: {e}", file=sys.stderr)
                      sys.exit(1)
              else:
                  print("WARNING: FIREBASE_CREDENTIALS is empty", file=sys.stderr)

              data = {
                  'secrets': {
                      'redisUrl': os.environ.get('GW_REDIS_URL', ''),
                      'firebaseCredentials': firebase_creds,
                      'firebaseProjectId': os.environ.get('FIREBASE_PROJECT_ID', ''),
                  },
              }

          elif service == "auth-service":
              data = {
                  'secrets': {
                      'databaseUrl': os.environ.get('AUTH_DATABASE_URL', ''),
                      'redisUrl': os.environ.get('AUTH_REDIS_URL', ''),
                  },
              }

          elif service == "user-service":
              data = {
                  'secrets': {
                      'mongodbUrl': os.environ.get('USER_MONGODB_URL', ''),
                      'redisUrl': os.environ.get('USER_REDIS_URL', ''),
                  },
              }

          elif service == "file-service":
              data = {
                  'config': {
                      's3Endpoint': os.environ.get('FILE_S3_ENDPOINT', ''),
                  },
                  'secrets': {
                      'databaseUrl': os.environ.get('FILE_DATABASE_URL', ''),
                      'redisUrl': os.environ.get('FILE_REDIS_URL', ''),
                      's3AccessKey': os.environ.get('FILE_S3_ACCESS_KEY', ''),
                      's3SecretKey': os.environ.get('FILE_S3_SECRET_KEY', ''),
                  },
              }

          elif service == "rating-service":
              data = {
                  'secrets': {
                      'databaseUrl': os.environ.get('RATING_DATABASE_URL', ''),
                      'redisUrl': os.environ.get('RATING_REDIS_URL', ''),
                  },
              }

          elif service == "vehicle-service":
              data = {
                  'secrets': {
                      'databaseUrl': os.environ.get('VEHICLE_DATABASE_URL', ''),
                      'redisUrl': os.environ.get('VEHICLE_REDIS_URL', ''),
                  },
              }

          elif service == "trips-service":
              data = {
                  'secrets': {
                      'databaseUrl': os.environ.get('TRIPS_DATABASE_URL', ''),
                      'redisUrl': os.environ.get('TRIPS_REDIS_URL', ''),
                  },
              }

          elif service == "booking-service":
              data = {
                  'secrets': {
                      'databaseUrl': os.environ.get('BOOKING_DATABASE_URL', ''),
                      'redisUrl': os.environ.get('BOOKING_REDIS_URL', ''),
                  },
              }

          elif service == "payment-service":
              data = {
                  'secrets': {
                      'databaseUrl': os.environ.get('PAYMENT_DATABASE_URL', ''),
                      'redisUrl': os.environ.get('PAYMENT_REDIS_URL', ''),
                      'fedapayApiUrl': os.environ.get('PAYMENT_FEDAPAY_API_URL', ''),
                      'fedapayApiKey': os.environ.get('PAYMENT_FEDAPAY_API_KEY', ''),
                      'fedapayWebhookSecret': os.environ.get('PAYMENT_FEDAPAY_WEBHOOK_SECRET', ''),
                  },
              }

          elif service == "kyc-service":
              data = {
                  'secrets': {
                      'personaApiKey': os.environ.get('KYC_PERSONA_API_KEY', ''),
                      'personaWebhookSecret': os.environ.get('KYC_PERSONA_WEBHOOK_SECRET', ''),
                  },
              }

          else:
              print(f"ERROR: Unknown service '{service}'", file=sys.stderr)
              sys.exit(1)

          with open('/tmp/secrets-values.yaml', 'w') as f:
              yaml.dump(data, f, default_flow_style=False, allow_unicode=True)
          PYEOF

      - name: Deploy with Helm
        run: |
          helm upgrade --install ${{ matrix.service }} \
            services/${{ matrix.service }}/deployments/helm \
            -f services/${{ matrix.service }}/deployments/helm/values/vps-dev.yaml \
            -f /tmp/secrets-values.yaml \
            --namespace ${{ env.DEPLOY_NAMESPACE }} \
            --create-namespace \
            --set image.tag=develop-${{ github.sha }} \
            --wait \
            --timeout 5m

      - name: Show pod status on failure
        if: failure()
        run: |
          echo "=== Pods ==="
          kubectl get pods -n ${{ env.DEPLOY_NAMESPACE }} -l app.kubernetes.io/name=${{ matrix.service }}
          echo "=== Events ==="
          kubectl describe pod -n ${{ env.DEPLOY_NAMESPACE }} -l app.kubernetes.io/name=${{ matrix.service }} | tail -30
          echo "=== Logs ==="
          kubectl logs -n ${{ env.DEPLOY_NAMESPACE }} -l app.kubernetes.io/name=${{ matrix.service }} --tail=50 || true

      - name: Deployment info
        run: |
          echo "Service deployed:"
          echo "  Name: ${{ matrix.service }}"
          echo "  Namespace: ${{ env.DEPLOY_NAMESPACE }}"
          echo "  Image: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:develop-${{ github.sha }}"

  health-check:
    name: Health Check
    needs: [detect-changes, deploy]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}
    steps:
      - name: Setup kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.VPS_KUBECONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Check deployment status
        run: |
          echo "Checking deployment status for ${{ matrix.service }} in namespace ${{ env.DEPLOY_NAMESPACE }}..."
          kubectl rollout status deployment/${{ matrix.service }} \
            -n ${{ env.DEPLOY_NAMESPACE }} \
            --timeout=120s

      - name: Check pod health
        run: |
          echo "Checking pod health..."
          kubectl get pods \
            -n ${{ env.DEPLOY_NAMESPACE }} \
            -l app.kubernetes.io/name=${{ matrix.service }} \
            -o wide

          kubectl wait --for=condition=ready pod \
            -l app.kubernetes.io/name=${{ matrix.service }} \
            -n ${{ env.DEPLOY_NAMESPACE }} \
            --timeout=120s

      - name: Verify service endpoint
        run: |
          echo "Service endpoint:"
          kubectl get svc ${{ matrix.service }} -n ${{ env.DEPLOY_NAMESPACE }}

      - name: Show pod logs (last 50 lines)
        if: failure()
        run: |
          echo "Pod logs for troubleshooting:"
          kubectl logs \
            -n ${{ env.DEPLOY_NAMESPACE }} \
            -l app.kubernetes.io/name=${{ matrix.service }} \
            --tail=50

  deployment-summary:
    name: Deployment Summary
    needs: [detect-changes, build-and-push, deploy, health-check]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Summary
        run: |
          echo "VPS Deployment Summary"
          echo "======================="
          echo "Environment: VPS Development"
          echo "Namespace: ${{ env.DEPLOY_NAMESPACE }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Services: ${{ needs.detect-changes.outputs.services }}"
          echo ""
          echo "Results:"
          echo "  Build: ${{ needs.build-and-push.result }}"
          echo "  Deploy: ${{ needs.deploy.result }}"
          echo "  Health Check: ${{ needs.health-check.result }}"

          if [ "${{ needs.health-check.result }}" != "success" ]; then
            echo ""
            echo "Deployment may have issues. Check the logs above."
            exit 1
          fi

          echo ""
          echo "Deployment successful!"
          echo ""
          echo "Access your services:"
          echo "  - API Gateway: http://dev.tissi-mah.com"
          echo "  - Auth API: http://dev.tissi-mah.com/api/v1/auth/*"
          echo "  - User API: http://dev.tissi-mah.com/api/v1/user/*"

# =============================================================================
# Notes d'utilisation
# =============================================================================
#
# Ce workflow deploie automatiquement les services modifies vers le VPS-dev.
#
# Declenchement automatique:
#   - Push sur la branche "develop"
#   - Modifications dans services/** ou pkg/**
#
# Declenchement manuel:
#   - GitHub Actions -> Deploy to VPS -> Run workflow
#   - Selectionner un service specifique (optionnel)
#
# Prerequis:
#   1. Secret GitHub: VPS_KUBECONFIG (kubeconfig VPS encode en base64)
#
#   2. Secrets Firebase (partages entre api-gateway et auth-service):
#      - AUTH_FIREBASE_CREDENTIALS : contenu JSON du service account Firebase
#      - AUTH_FIREBASE_PROJECT_ID  : ID du projet Firebase
#
#   3. Secrets GitHub pour api-gateway:
#      - GW_REDIS_URL : redis://host:6379
#
#   4. Secrets GitHub pour auth-service:
#      - AUTH_DATABASE_URL : postgresql://user:pass@host:5432/dbname
#      - AUTH_REDIS_URL    : redis://host:6379
#
#   5. Secrets GitHub pour user-service:
#      - USER_MONGODB_URL : mongodb://user:pass@host:27017/dbname
#      - USER_REDIS_URL   : redis://host:6379
#
#   6. Secrets GitHub pour file-service:
#      - FILE_DATABASE_URL  : postgresql://user:pass@host:5434/file_db
#      - FILE_REDIS_URL     : redis://host:6383/0
#      - FILE_S3_ACCESS_KEY : cle d'acces S3/MinIO
#      - FILE_S3_SECRET_KEY : cle secrete S3/MinIO
#      - FILE_S3_ENDPOINT   : http://host:9000 (URL MinIO/S3)
#
#   7. Secrets GitHub pour rating-service:
#      - RATING_DATABASE_URL : postgresql://user:pass@host:5435/rating_db
#      - RATING_REDIS_URL    : redis://host:6384/0
#
#   8. Secrets GitHub pour vehicle-service:
#      - VEHICLE_DATABASE_URL : postgresql://user:pass@host:5436/vehicle_db
#      - VEHICLE_REDIS_URL    : redis://host:6385/0
#
#   9. Secrets GitHub pour trips-service:
#      - TRIPS_DATABASE_URL : postgresql://user:pass@host:5437/trips_db
#      - TRIPS_REDIS_URL    : redis://host:6386/0
#
#  10. Secrets GitHub pour booking-service:
#      - BOOKING_DATABASE_URL : postgresql://user:pass@host:5438/booking_db
#      - BOOKING_REDIS_URL    : redis://host:6387/0
#
#  11. Secrets GitHub pour payment-service:
#      - PAYMENT_DATABASE_URL        : postgresql://user:pass@host:5439/payment_db
#      - PAYMENT_REDIS_URL           : redis://host:6388/0
#      - PAYMENT_FEDAPAY_API_URL     : https://sandbox-api.fedapay.com (ou production)
#      - PAYMENT_FEDAPAY_API_KEY     : cle API FedaPay
#      - PAYMENT_FEDAPAY_WEBHOOK_SECRET : secret HMAC pour valider les webhooks FedaPay
#
#  12. Secrets GitHub pour kyc-service:
#      - KYC_PERSONA_API_KEY       : cle API Persona (sandbox ou production)
#      - KYC_PERSONA_WEBHOOK_SECRET : secret HMAC pour valider les webhooks Persona
#
# Architecture:
#   VPS K3s namespace "default":
#     |- api-gateway (HTTP LoadBalancer, port 8080)
#     |- auth-service (gRPC ClusterIP, port 50051)
#     |- user-service (gRPC ClusterIP, port 50052)
#     |- file-service (gRPC ClusterIP, port 50053)
#     |- rating-service (gRPC ClusterIP, port 50054)
#     |- vehicle-service (gRPC ClusterIP, port 50055)
#     |- trips-service (gRPC ClusterIP, port 50056)
#     |- booking-service (gRPC ClusterIP, port 50058)
#     |- payment-service (gRPC ClusterIP, port 50059)
#     |- kyc-service (gRPC ClusterIP, port 50057)
