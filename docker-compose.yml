    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_SUPPORT_USER:-dev} -d ${POSTGRES_SUPPORT_DB:-support_db} -h localhost",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tissi-mah-network

  # Redis dédié pour Support Service (OTP, refresh tokens, rate limit)
  support-redis:
    image: redis:7-alpine
    container_name: tissi-mah-support-redis
    ports:
      - "6390:6379"
    volumes:
