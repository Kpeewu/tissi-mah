    command: ["-path", "/migrations", "-database", "postgresql://${POSTGRES_BOOKING_USER:-dev}:${POSTGRES_BOOKING_PASSWORD:-dev123}@booking-postgres:5432/${POSTGRES_BOOKING_DB:-booking_db}?sslmode=disable", "up"]
    networks:
      - tissi-mah-network

  payment-migrate:
    image: migrate/migrate:v4.17.0
    depends_on:
      payment-postgres:
        condition: service_healthy
    volumes:
      - ./services/payment-service/migrations:/migrations
    command: ["-path", "/migrations", "-database", "postgresql://${POSTGRES_PAYMENT_USER:-dev}:${POSTGRES_PAYMENT_PASSWORD:-dev123}@payment-postgres:5432/${POSTGRES_PAYMENT_DB:-payment_db}?sslmode=disable", "up"]
    networks:
      - tissi-mah-network

  notification-migrate:
    image: migrate/migrate:v4.17.0
    depends_on:
      notification-postgres:
        condition: service_healthy
    volumes:
      - ./services/notification-service/migrations:/migrations
    command: ["-path", "/migrations", "-database", "postgresql://${POSTGRES_NOTIFICATION_USER:-dev}:${POSTGRES_NOTIFICATION_PASSWORD:-dev123}@notification-postgres:5432/${POSTGRES_NOTIFICATION_DB:-notification_db}?sslmode=disable", "up"]
    networks:
      - tissi-mah-network

  support-migrate:
    image: migrate/migrate:v4.17.0
    depends_on:
      support-postgres:
        condition: service_healthy
    volumes:
      - ./services/support-service/migrations:/migrations
    command: ["-path", "/migrations", "-database", "postgresql://${POSTGRES_SUPPORT_USER:-dev}:${POSTGRES_SUPPORT_PASSWORD:-dev123}@support-postgres:5432/${POSTGRES_SUPPORT_DB:-support_db}?sslmode=disable", "up"]
    networks:
      - tissi-mah-network

  # MinIO - Stockage S3 compatible (dev local)
  # SÉCURITÉ: ports liés à 127.0.0.1 uniquement — ne pas exposer sur 0.0.0.0 en dev partagé ou sur VPS.
  # En prod/staging, MinIO doit être derrière un reverse-proxy TLS (port 9000 fermé au firewall).
  minio:
    image: minio/minio:latest
    container_name: tissi-mah-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tissi-mah-network

  # MinIO init - Crée le bucket et le compte de service au démarrage
  # Le compte root (minioadmin) n'est utilisé que pour l'init.
  # file-service utilise le compte 'filesvc' avec une policy restreinte au bucket.
  minio-init:
    image: minio/mc:latest
    container_name: tissi-mah-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      FILESVC_SECRET_KEY: ${FILESVC_SECRET_KEY:-filesvc-dev-secret}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/tissi-mah-files &&
      mc anonymous set none local/tissi-mah-files &&
      printf '{\"Version\":\"2012-10-17\",\"Statement\":[{\"Effect\":\"Allow\",\"Action\":[\"s3:GetObject\",\"s3:PutObject\",\"s3:DeleteObject\"],\"Resource\":[\"arn:aws:s3:::tissi-mah-files/*\"]}]}' > /tmp/filesvc-policy.json &&
      mc admin policy create local file-service-policy /tmp/filesvc-policy.json || true &&
      mc admin user add local filesvc $$FILESVC_SECRET_KEY &&
      mc admin policy attach local file-service-policy --user filesvc
      "
    networks:
      - tissi-mah-network

  # -------------------------------------------------------------------------
  # Chat Service (messagerie passager-chauffeur)
  # - Postgres : threads + messages chiffrés AES-GCM (port 5442)
  # - Redis    : locks + TripCloserWorker (subscribe trip.completed) (port 6392)
  # NotificationRedis n'est PAS un container dédié : chat-service publie ses
  # events NEW_MESSAGE sur le Redis trips/notification (existant) consommé
  # par notification-service.
  # -------------------------------------------------------------------------
  chat-postgres:
    image: postgres:15-alpine
    container_name: tissi-mah-chat-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_CHAT_USER:-dev}
      POSTGRES_PASSWORD: ${POSTGRES_CHAT_PASSWORD:-dev123}
      POSTGRES_DB: ${POSTGRES_CHAT_DB:-chat_db}
    ports:
      - "5442:5432"
    volumes:
      - chat_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_CHAT_USER:-dev} -d ${POSTGRES_CHAT_DB:-chat_db} -h localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tissi-mah-network

  chat-redis:
    image: redis:7-alpine
    container_name: tissi-mah-chat-redis
    ports:
      - "6392:6379"
    volumes:
      - chat_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tissi-mah-network

  chat-migrate:
    image: migrate/migrate:v4.17.0
    container_name: tissi-mah-chat-migrate
    depends_on:
      chat-postgres:
        condition: service_healthy
    volumes:
      - ./services/chat-service/migrations:/migrations
    command:
      [
        "-path",
        "/migrations",
        "-database",
        "postgresql://${POSTGRES_CHAT_USER:-dev}:${POSTGRES_CHAT_PASSWORD:-dev123}@chat-postgres:5432/${POSTGRES_CHAT_DB:-chat_db}?sslmode=disable",
        "up",
      ]
    restart: on-failure
    networks:
      - tissi-mah-network

  # -------------------------------------------------------------------------
  # moderation-service
  # - Postgres : logs de modération + violations (port 5443)
  # -------------------------------------------------------------------------
  moderation-postgres:
    image: postgres:15-alpine
    container_name: tissi-mah-moderation-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_MODERATION_USER:-dev}
      POSTGRES_PASSWORD: ${POSTGRES_MODERATION_PASSWORD:-dev123}
      POSTGRES_DB: ${POSTGRES_MODERATION_DB:-moderation_db}
    ports:
      - "5443:5432"
    volumes:
      - moderation_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_MODERATION_USER:-dev} -d ${POSTGRES_MODERATION_DB:-moderation_db} -h localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tissi-mah-network

  moderation-migrate:
    image: migrate/migrate:v4.17.0
    container_name: tissi-mah-moderation-migrate
    depends_on:
      moderation-postgres:
        condition: service_healthy
    volumes:
      - ./services/moderation-service/migrations:/migrations
    command:
      [
        "-path",
        "/migrations",
        "-database",
        "postgresql://${POSTGRES_MODERATION_USER:-dev}:${POSTGRES_MODERATION_PASSWORD:-dev123}@moderation-postgres:5432/${POSTGRES_MODERATION_DB:-moderation_db}?sslmode=disable",
        "up",
      ]
    restart: on-failure
    networks:
