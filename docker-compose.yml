version: "3.8"

services:
  # PostgreSQL pour Auth Service
  auth-postgres:
    image: postgres:15-alpine
    container_name: tissi-mah-auth-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_AUTH_USER:-dev}
      POSTGRES_PASSWORD: ${POSTGRES_AUTH_PASSWORD:-dev123}
      POSTGRES_DB: ${POSTGRES_AUTH_DB:-auth_db}
    ports:
      - "5433:5432"
    volumes:
      - auth_postgres_data:/var/lib/postgresql/data
      - ./services/auth-service/migrations/up:/docker-entrypoint-initdb.d
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_AUTH_USER:-dev} -d ${POSTGRES_AUTH_DB:-auth_db} -h localhost",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tissi-mah-network

  # MongoDB pour User Service
  user-mongodb:
    image: mongo:7-jammy
    container_name: tissi-mah-user-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER_USER:-dev}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_USER_PASSWORD:-dev123}
      MONGO_INITDB_DATABASE: ${MONGO_USER_DB:-user_db}
    ports:
      - "27018:27017"
    volumes:
      - user_mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tissi-mah-network

  # Redis (partagé — auth-service)
  redis:
    image: redis:7-alpine
    container_name: tissi-mah-redis
    ports:
      - "6381:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tissi-mah-network

  # Redis dédié pour API Gateway (rate limiting)
  gateway-redis:
    image: redis:7-alpine
    container_name: tissi-mah-gateway-redis
    ports:
      - "6380:6379"
    volumes:
      - gateway_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tissi-mah-network

  # Redis dédié pour User Service
  user-redis:
    image: redis:7-alpine
    container_name: tissi-mah-user-redis
    ports:
      - "6382:6379"
    volumes:
      - user_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tissi-mah-network

  # PostgreSQL pour File Service
  file-postgres:
    image: postgres:15-alpine
    container_name: tissi-mah-file-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_FILE_USER:-dev}
      POSTGRES_PASSWORD: ${POSTGRES_FILE_PASSWORD:-dev123}
      POSTGRES_DB: ${POSTGRES_FILE_DB:-file_db}
    ports:
      - "5434:5432"
    volumes:
      - file_postgres_data:/var/lib/postgresql/data
      - ./services/file-service/migrations/up:/docker-entrypoint-initdb.d
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_FILE_USER:-dev} -d ${POSTGRES_FILE_DB:-file_db} -h localhost",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tissi-mah-network

  # Redis dédié pour File Service
  file-redis:
    image: redis:7-alpine
    container_name: tissi-mah-file-redis
    ports:
      - "6383:6379"
    volumes:
      - file_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tissi-mah-network

  # PostgreSQL pour Rating Service
  rating-postgres:
    image: postgres:15-alpine
    container_name: tissi-mah-rating-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_RATING_USER:-dev}
      POSTGRES_PASSWORD: ${POSTGRES_RATING_PASSWORD:-dev123}
      POSTGRES_DB: ${POSTGRES_RATING_DB:-rating_db}
    ports:
      - "5435:5432"
    volumes:
      - rating_postgres_data:/var/lib/postgresql/data
      - ./services/rating-service/migrations/up:/docker-entrypoint-initdb.d
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_RATING_USER:-dev} -d ${POSTGRES_RATING_DB:-rating_db} -h localhost",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tissi-mah-network

  # Redis dédié pour Rating Service
  rating-redis:
    image: redis:7-alpine
    container_name: tissi-mah-rating-redis
    ports:
      - "6384:6379"
    volumes:
      - rating_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tissi-mah-network

  # PostgreSQL pour Vehicle Service
  vehicle-postgres:
    image: postgres:15-alpine
    container_name: tissi-mah-vehicle-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_VEHICLE_USER:-dev}
      POSTGRES_PASSWORD: ${POSTGRES_VEHICLE_PASSWORD:-dev123}
      POSTGRES_DB: ${POSTGRES_VEHICLE_DB:-vehicle_db}
    ports:
      - "5436:5432"
    volumes:
      - vehicle_postgres_data:/var/lib/postgresql/data
      - ./services/vehicle-service/migrations/up:/docker-entrypoint-initdb.d
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_VEHICLE_USER:-dev} -d ${POSTGRES_VEHICLE_DB:-vehicle_db} -h localhost",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tissi-mah-network

  # Redis dédié pour Vehicle Service
  vehicle-redis:
    image: redis:7-alpine
    container_name: tissi-mah-vehicle-redis
    ports:
      - "6385:6379"
    volumes:
      - vehicle_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tissi-mah-network

  # PostgreSQL pour Trips Service (PostGIS requis pour les coordonnées géographiques)
  trips-postgres:
    image: postgis/postgis:15-3.4-alpine
    container_name: tissi-mah-trips-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_TRIPS_USER:-dev}
      POSTGRES_PASSWORD: ${POSTGRES_TRIPS_PASSWORD:-dev123}
      POSTGRES_DB: ${POSTGRES_TRIPS_DB:-trips_db}
    ports:
      - "5437:5432"
    volumes:
      - trips_postgres_data:/var/lib/postgresql/data
      - ./services/trips-service/migrations/up:/docker-entrypoint-initdb.d
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_TRIPS_USER:-dev} -d ${POSTGRES_TRIPS_DB:-trips_db} -h localhost",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tissi-mah-network

  # Redis dédié pour Trips Service
  trips-redis:
    image: redis:7-alpine
    container_name: tissi-mah-trips-redis
    ports:
      - "6386:6379"
    volumes:
      - trips_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tissi-mah-network

  # PostgreSQL pour Booking Service
  booking-postgres:
    image: postgres:15-alpine
    container_name: tissi-mah-booking-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_BOOKING_USER:-dev}
      POSTGRES_PASSWORD: ${POSTGRES_BOOKING_PASSWORD:-dev123}
      POSTGRES_DB: ${POSTGRES_BOOKING_DB:-booking_db}
    ports:
      - "5438:5432"
    volumes:
      - booking_postgres_data:/var/lib/postgresql/data
      - ./services/booking-service/migrations/up:/docker-entrypoint-initdb.d
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_BOOKING_USER:-dev} -d ${POSTGRES_BOOKING_DB:-booking_db} -h localhost",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tissi-mah-network

  # Redis dédié pour Booking Service
  booking-redis:
    image: redis:7-alpine
    container_name: tissi-mah-booking-redis
    ports:
      - "6387:6379"
    volumes:
      - booking_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tissi-mah-network

  # PostgreSQL pour Payment Service
  payment-postgres:
    image: postgres:15-alpine
    container_name: tissi-mah-payment-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_PAYMENT_USER:-dev}
      POSTGRES_PASSWORD: ${POSTGRES_PAYMENT_PASSWORD:-dev123}
      POSTGRES_DB: ${POSTGRES_PAYMENT_DB:-payment_db}
    ports:
      - "5439:5432"
    volumes:
      - payment_postgres_data:/var/lib/postgresql/data
      - ./services/payment-service/migrations/up:/docker-entrypoint-initdb.d
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_PAYMENT_USER:-dev} -d ${POSTGRES_PAYMENT_DB:-payment_db} -h localhost",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tissi-mah-network

  # Redis dédié pour Payment Service
  payment-redis:
    image: redis:7-alpine
    container_name: tissi-mah-payment-redis
    ports:
      - "6388:6379"
    volumes:
      - payment_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tissi-mah-network

  # MinIO - Stockage S3 compatible (dev local)
  minio:
    image: minio/minio:latest
    container_name: tissi-mah-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tissi-mah-network

  # MinIO init - Crée le bucket au démarrage
  minio-init:
    image: minio/mc:latest
    container_name: tissi-mah-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/tissi-mah-files &&
      mc anonymous set download local/tissi-mah-files
      "
    networks:
      - tissi-mah-network

volumes:
  auth_postgres_data:
  redis_data:
  user_mongodb_data:
  user_redis_data:
  gateway_redis_data:
  file_postgres_data:
  file_redis_data:
  rating_postgres_data:
  rating_redis_data:
  vehicle_postgres_data:
  vehicle_redis_data:
  trips_postgres_data:
  trips_redis_data:
  booking_postgres_data:
  booking_redis_data:
  payment_postgres_data:
  payment_redis_data:
  minio_data:

networks:
  tissi-mah-network:
    driver: bridge
