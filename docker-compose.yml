version: "3.8"

services:
  # PostgreSQL pour Auth Service
  auth-postgres:
    image: postgres:15-alpine
    container_name: tissi-mah-auth-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_AUTH_USER:-dev}
      POSTGRES_PASSWORD: ${POSTGRES_AUTH_PASSWORD:-dev123}
      POSTGRES_DB: ${POSTGRES_AUTH_DB:-auth_db}
    ports:
      - "5433:5432"
    volumes:
      - auth_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_AUTH_USER:-dev} -d ${POSTGRES_AUTH_DB:-auth_db} -h localhost",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tissi-mah-network

  auth-migrate:
    image: migrate/migrate:v4.17.0
    depends_on:
      auth-postgres:
        condition: service_healthy
    volumes:
      - ./services/auth-service/migrations:/migrations
    command: ["-path", "/migrations", "-database", "postgresql://${POSTGRES_AUTH_USER:-dev}:${POSTGRES_AUTH_PASSWORD:-dev123}@auth-postgres:5432/${POSTGRES_AUTH_DB:-auth_db}?sslmode=disable", "up"]
    networks:
      - tissi-mah-network

  # MongoDB pour User Service
  user-mongodb:
    image: mongo:7-jammy
    container_name: tissi-mah-user-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER_USER:-dev}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_USER_PASSWORD:-dev123}
      MONGO_INITDB_DATABASE: ${MONGO_USER_DB:-user_db}
    ports:
      - "27018:27017"
    volumes:
      - user_mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tissi-mah-network

  # Redis (partagé — auth-service)
  redis:
    image: redis:7-alpine
    container_name: tissi-mah-redis
    ports:
      - "6381:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tissi-mah-network

  # Redis dédié pour API Gateway (rate limiting)
  gateway-redis:
    image: redis:7-alpine
    container_name: tissi-mah-gateway-redis
    ports:
      - "6380:6379"
    volumes:
      - gateway_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tissi-mah-network

  # Redis dédié pour User Service
  user-redis:
    image: redis:7-alpine
    container_name: tissi-mah-user-redis
    ports:
      - "6382:6379"
    volumes:
      - user_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tissi-mah-network

  # PostgreSQL pour File Service
  file-postgres:
    image: postgres:15-alpine
    container_name: tissi-mah-file-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_FILE_USER:-dev}
      POSTGRES_PASSWORD: ${POSTGRES_FILE_PASSWORD:-dev123}
      POSTGRES_DB: ${POSTGRES_FILE_DB:-file_db}
    ports:
      - "5434:5432"
    volumes:
      - file_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_FILE_USER:-dev} -d ${POSTGRES_FILE_DB:-file_db} -h localhost",
        ]
      interval: 10s
      timeout: 5s
