  # PostgreSQL pour Support Service (back-office admin/support)
  support-postgres:
    image: postgres:15-alpine
    container_name: tissi-mah-support-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_SUPPORT_USER:-dev}
      POSTGRES_PASSWORD: ${POSTGRES_SUPPORT_PASSWORD:-dev123}
      POSTGRES_DB: ${POSTGRES_SUPPORT_DB:-support_db}
    ports:
      - "5441:5432"
    volumes:
