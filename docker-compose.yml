    command: ["-path", "/migrations", "-database", "postgresql://${POSTGRES_VEHICLE_USER:-dev}:${POSTGRES_VEHICLE_PASSWORD:-dev123}@vehicle-postgres:5432/${POSTGRES_VEHICLE_DB:-vehicle_db}?sslmode=disable", "up"]
