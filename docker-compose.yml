    command: ["-path", "/migrations", "-database", "postgresql://${POSTGRES_TRIPS_USER:-dev}:${POSTGRES_TRIPS_PASSWORD:-dev123}@trips-postgres:5432/${POSTGRES_TRIPS_DB:-trips_db}?sslmode=disable", "up"]
