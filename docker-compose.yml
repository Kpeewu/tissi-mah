  file-migrate:
    image: migrate/migrate:v4.17.0
    depends_on:
      file-postgres:
        condition: service_healthy
    volumes:
      - ./services/file-service/migrations:/migrations
    command: ["-path", "/migrations", "-database", "postgresql://${POSTGRES_FILE_USER:-dev}:${POSTGRES_FILE_PASSWORD:-dev123}@file-postgres:5432/${POSTGRES_FILE_DB:-file_db}?sslmode=disable", "up"]
