  # Redis dédié pour Geolocation Service (cache routes OSRM + résultats Nominatim)
  # Service stateless : pas de Postgres, juste ce Redis pour le cache.
  # Graceful degradation si indisponible — le service tourne mais sans cache.
  geolocation-redis:
    image: redis:7-alpine
    container_name: tissi-mah-geolocation-redis
    ports:
      - "6391:6379"
    volumes:
