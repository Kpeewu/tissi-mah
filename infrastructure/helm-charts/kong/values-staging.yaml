# Kong Values - Staging Environment
# Pre-production configuration for AWS EKS
---

# Environment identifier
environment: staging

# =============================================================================
# Kong Gateway Configuration
# =============================================================================
kong:
  # API Gateway host
  host: staging.tissi-mah.com

  # Replica count (moderate for staging)
  replicaCount: 2

  # Image configuration
  image:
    repository: kong
    tag: "3.5"
    pullPolicy: IfNotPresent

  # Resource limits (moderate for staging)
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

  # Environment variables
  env:
    database: "off"
    proxy_access_log: /dev/stdout
    admin_access_log: /dev/stdout
    proxy_error_log: /dev/stderr
    admin_error_log: /dev/stderr
    log_level: info
    plugins: bundled,grpc-gateway,grpc-web
    declarative_config: /kong/declarative/kong.yaml
    # Performance tuning
    nginx_worker_processes: "2"
    nginx_proxy_real_ip_header: "X-Forwarded-For"
    trusted_ips: "0.0.0.0/0,::/0"

  # Proxy service configuration
  proxy:
    enabled: true
    type: LoadBalancer
    annotations:
      service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
      service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
      service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
    http:
      enabled: true
      containerPort: 8000
      servicePort: 80
    tls:
      enabled: true
      containerPort: 8443
      servicePort: 443

  # Admin API (disabled in staging)
  admin:
    enabled: false

  # Ingress controller
  ingressController:
    enabled: true
    installCRDs: true

  # Pod disruption budget
  podDisruptionBudget:
    enabled: true
    minAvailable: 1

  # Autoscaling
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

  # Affinity rules
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values:
                    - kong
            topologyKey: kubernetes.io/hostname

# =============================================================================
# Redis Configuration (for rate limiting)
# =============================================================================
redis:
  enabled: true
  host: redis.staging.svc.cluster.local
  port: 6379
  password: "${REDIS_PASSWORD}"  # From secret
  database: 1
  ssl: false

# =============================================================================
# Firebase Configuration
# =============================================================================
firebase:
  projectId: "tissi-mah-staging"

# =============================================================================
# TLS Configuration
# =============================================================================
tls:
  enabled: true
  clusterIssuer: letsencrypt-prod
  secretName: tissi-mah-staging-tls

# =============================================================================
# Rate Limiting (production-like limits)
# =============================================================================
rateLimiting:
  global:
    minute: 60
    hour: 1000
  auth:
    second: 2
    minute: 15
    hour: 150
  createAccount:
    minute: 5
    hour: 20
    day: 50
  sensitive:
    minute: 2
    hour: 10
    day: 20

# =============================================================================
# Monitoring
# =============================================================================
metrics:
  enabled: true
  serviceMonitor:
    enabled: true
    namespace: monitoring
    labels:
      release: prometheus

# =============================================================================
# Logging
# =============================================================================
logging:
  level: info
  format: json

# =============================================================================
# Services (backend endpoints)
# =============================================================================
services:
  authService:
    host: auth-service.staging.svc.cluster.local
    port: 50051
    protocol: grpc

# =============================================================================
# Security
# =============================================================================
security:
  # Pod security context
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000

  # Container security context
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

# =============================================================================
# Feature Flags
# =============================================================================
features:
  grpcGateway: true
  grpcWeb: true
  rateLimiting: true
  cors: true
  jwtValidation: true
