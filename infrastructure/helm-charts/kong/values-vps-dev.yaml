# Kong Values - VPS Development Environment
# Lightweight configuration for development on VPS (K3s)
---
# Environment identifier
environment: vps-dev

# =============================================================================
# Kong Gateway Configuration
# =============================================================================
kong:
  # API Gateway host
  host: api.tissimah.kpeewu.dev

  # Replica count (minimal for dev)
  replicaCount: 1

  # Image configuration
  image:
    repository: kong
    tag: "3.5"
    pullPolicy: IfNotPresent

  # Resource limits (conservative for VPS)
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # Environment variables
  env:
    database: "off" # DB-less mode
    proxy_access_log: /dev/stdout
    admin_access_log: /dev/stdout
    proxy_error_log: /dev/stderr
    admin_error_log: /dev/stderr
    log_level: debug
    plugins: bundled,grpc-gateway,grpc-web
    # NOTE: Pas de declarative_config car on utilise des CRDs (KongPlugin, Ingress)
    # La configuration est faite via kubectl apply -f plugins/*.yaml et routes/*.yaml

  # Proxy service configuration
  proxy:
    enabled: true
    type: LoadBalancer
    http:
      enabled: true
      containerPort: 8000
      servicePort: 80
    tls:
      enabled: true
      containerPort: 8443
      servicePort: 443

  # Admin API (disabled in production, enabled for dev)
  admin:
    enabled: true
    type: ClusterIP
    http:
      enabled: true
      containerPort: 8001
      servicePort: 8001
    tls:
      enabled: false

  # Ingress controller
  # Nécessaire pour lire les CRDs (KongPlugin, KongIngress, Ingress)
  ingressController:
    enabled: true
    installCRDs: true

# =============================================================================
# Redis Configuration (for rate limiting)
# Redis Kong tourne dans Docker avec network_mode: host
# Il écoute sur 127.0.0.1:6380 (différent de Redis auth sur 127.0.0.1:6379)
# =============================================================================
redis:
  enabled: true
  # Host: 127.0.0.1 car Redis Kong est dans Docker avec network_mode: host
  # Kong (dans K3s) peut accéder à 127.0.0.1 du VPS
  host: 127.0.0.1
  # Port: 6380 (Redis Kong), différent de 6379 (Redis auth-service)
  port: 6379
  # Password: Géré via Secret K8s (kong-redis-secret)
  # Les plugins rate-limiting.yaml référencent ce secret directement
  password: ""
  # Database: 1 (séparé de la database 0 si on utilise le même Redis)
  database: 1

# =============================================================================
# Firebase Configuration
# =============================================================================
firebase:
  projectId: "tissi-mah-dev"

# =============================================================================
# TLS Configuration
# =============================================================================
tls:
  enabled: true
  clusterIssuer: letsencrypt-staging # Use staging for dev
  secretName: tissi-mah-dev-tls

# =============================================================================
# Rate Limiting Overrides (relaxed for dev)
# Ces valeurs sont utilisées dans plugins/rate-limiting.yaml via {{ .Values.rateLimiting.* }}
# =============================================================================
rateLimiting:
  global:
    minute: 120 # 120 requests per minute
    hour: 5000 # 5000 requests per hour
  auth:
    second: 5 # 5 requests per second
    minute: 30 # 30 requests per minute
  createAccount:
    minute: 10 # 10 account creations per minute
    hour: 50 # 50 account creations per hour
  sensitive:
    minute: 5 # 5 requests per minute
    hour: 20 # 20 requests per hour

# =============================================================================
# Monitoring (minimal for dev)
# =============================================================================
metrics:
  enabled: true
  serviceMonitor:
    enabled: false # No Prometheus in dev VPS

# =============================================================================
# Logging
# =============================================================================
logging:
  level: debug
  format: json

# =============================================================================
# Services (backend endpoints)
# Format: <service>.<namespace>.svc.cluster.local
# OU juste <service> si dans le même namespace que Kong
# =============================================================================
services:
  authService:
    # Option 1: Nom court (si auth-service dans le même namespace que Kong)
    host: auth-service
    # Option 2: Nom complet (explicite)
    # host: auth-service.default.svc.cluster.local
    port: 50051
    protocol: grpc

# =============================================================================
# Feature Flags
# =============================================================================
features:
  grpcGateway: true
  grpcWeb: false
  rateLimiting: true
  cors: true
  jwtValidation: true

# =============================================================================
# Notes d'utilisation
# =============================================================================
#
# Ce fichier configure Kong pour l'environnement VPS-dev avec:
# - Mode DB-less (pas de PostgreSQL)
# - CRDs pour la configuration (pas de fichier kong.yaml déclaratif)
# - Redis Kong dans Docker (127.0.0.1:6380)
# - auth-service dans K8s namespace "default"
#
# Installation:
#   helm install kong kong/kong \
#     --namespace default \
#     --values values-vps-dev.yaml
#
# Mise à jour:
#   helm upgrade kong kong/kong \
#     --namespace default \
#     --values values-vps-dev.yaml
#
# Architecture Redis:
#   Docker:
#     - Redis auth:   127.0.0.1:6379 (database 0) → auth-service
#     - Redis Kong:   127.0.0.1:6380 (database 1) → Kong rate-limiting
#
# Architecture Services:
#   K3s namespace "default":
#     - Kong Gateway (ce values.yaml)
#     - auth-service (à déployer)
#
# Plugins:
#   Les plugins sont appliqués via:
#     helm template . --values values-vps-dev.yaml \
#       --show-only plugins/cors.yaml | kubectl apply -f -
#
# Routes:
#   Les routes sont appliquées via:
#     helm template . --values values-vps-dev.yaml \
#       --show-only routes/auth-routes.yaml | kubectl apply -f -
