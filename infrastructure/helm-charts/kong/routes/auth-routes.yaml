# Kong Routes Configuration for Auth Service
# Defines HTTP routes that proxy to the auth-service gRPC backend
# Documentation: https://docs.konghq.com/gateway/latest/key-concepts/routes/
---
# =============================================================================
# Service Definition
# =============================================================================
apiVersion: configuration.konghq.com/v1
kind: KongIngress
metadata:
  name: auth-service-upstream
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: kong
    app.kubernetes.io/component: ingress
    service: auth-service
proxy:
  # gRPC protocol
  protocol: grpc
  # Connection settings
  connect_timeout: 10000   # 10 seconds
  read_timeout: 60000      # 60 seconds
  write_timeout: 60000     # 60 seconds
  retries: 3
upstream:
  # Load balancing algorithm
  algorithm: round-robin
  # Health checks
  healthchecks:
    active:
      type: grpc
      grpc_service: grpc.health.v1.Health
      grpc_status: 1  # SERVING
      healthy:
        interval: 10
        successes: 2
      unhealthy:
        interval: 5
        tcp_failures: 3
        http_failures: 3
    passive:
      healthy:
        successes: 5
      unhealthy:
        tcp_failures: 3
        http_failures: 3

---
# =============================================================================
# Kubernetes Service for auth-service
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: auth-service
    app.kubernetes.io/component: service
  annotations:
    konghq.com/override: auth-service-upstream
spec:
  type: ClusterIP
  ports:
    - name: grpc
      port: 50051
      targetPort: 50051
      protocol: TCP
  selector:
    app.kubernetes.io/name: auth-service

---
# =============================================================================
# Ingress Routes
# =============================================================================

# Login endpoint
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: auth-login
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: kong
    app.kubernetes.io/component: route
    service: auth-service
    endpoint: login
  annotations:
    kubernetes.io/ingress.class: kong
    konghq.com/plugins: >-
      cors-global,
      firebase-auth,
      rate-limiting-auth,
      request-transformer-grpc,
      response-transformer-grpc
    konghq.com/protocols: https,http
    konghq.com/methods: POST,OPTIONS
    konghq.com/strip-path: "false"
spec:
  ingressClassName: kong
  rules:
    - host: {{ .Values.kong.host }}
      http:
        paths:
          - path: /api/v1/auth/login
            pathType: Exact
            backend:
              service:
                name: auth-service
                port:
                  number: 50051

