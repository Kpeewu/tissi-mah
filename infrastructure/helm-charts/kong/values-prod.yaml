# Kong Values - Production Environment
# High-availability configuration for AWS EKS
---

# Environment identifier
environment: production

# =============================================================================
# Kong Gateway Configuration
# =============================================================================
kong:
  # API Gateway host
  host: api.tissi-mah.com

  # Replica count (high availability)
  replicaCount: 3

  # Image configuration
  image:
    repository: kong
    tag: "3.5"
    pullPolicy: IfNotPresent

  # Resource limits (production-grade)
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 2Gi

  # Environment variables
  env:
    database: "off"
    proxy_access_log: /dev/stdout
    admin_access_log: /dev/stdout
    proxy_error_log: /dev/stderr
    admin_error_log: /dev/stderr
    log_level: warn  # Less verbose in production
    plugins: bundled,grpc-gateway,grpc-web
    declarative_config: /kong/declarative/kong.yaml
    # Performance tuning
    nginx_worker_processes: "auto"
    nginx_proxy_real_ip_header: "X-Forwarded-For"
    trusted_ips: "0.0.0.0/0,::/0"
    # Connection pooling
    upstream_keepalive_pool_size: "60"
    upstream_keepalive_max_requests: "100"
    upstream_keepalive_idle_timeout: "60"

  # Proxy service configuration
  proxy:
    enabled: true
    type: LoadBalancer
    annotations:
      service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
      service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
      service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
      service.beta.kubernetes.io/aws-load-balancer-backend-protocol: "tcp"
      service.beta.kubernetes.io/aws-load-balancer-connection-idle-timeout: "60"
    http:
      enabled: true
      containerPort: 8000
      servicePort: 80
    tls:
      enabled: true
      containerPort: 8443
      servicePort: 443

  # Admin API (disabled in production)
  admin:
    enabled: false

  # Ingress controller
  ingressController:
    enabled: true
    installCRDs: true
    watchNamespaces:
      - production

  # Pod disruption budget
  podDisruptionBudget:
    enabled: true
    minAvailable: 2  # At least 2 pods must be available

  # Autoscaling
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 60
    targetMemoryUtilizationPercentage: 70
    behavior:
      scaleDown:
        stabilizationWindowSeconds: 300
        policies:
          - type: Percent
            value: 10
            periodSeconds: 60
      scaleUp:
        stabilizationWindowSeconds: 0
        policies:
          - type: Percent
            value: 100
            periodSeconds: 15
          - type: Pods
            value: 4
            periodSeconds: 15
        selectPolicy: Max

  # Affinity rules (spread across AZs)
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - kong
          topologyKey: topology.kubernetes.io/zone
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: node.kubernetes.io/instance-type
                operator: In
                values:
                  - m5.large
                  - m5.xlarge

  # Topology spread constraints
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: kong

  # Priority class
  priorityClassName: high-priority

# =============================================================================
# Redis Configuration (for rate limiting)
# =============================================================================
redis:
  enabled: true
  host: redis.production.svc.cluster.local
  port: 6379
  password: "${REDIS_PASSWORD}"  # From secret
  database: 1
  ssl: true
  # Cluster mode for HA
  cluster:
    enabled: true
    nodes:
      - redis-0.production.svc.cluster.local:6379
      - redis-1.production.svc.cluster.local:6379
      - redis-2.production.svc.cluster.local:6379

# =============================================================================
# Firebase Configuration
# =============================================================================
firebase:
  projectId: "tissi-mah"

# =============================================================================
# TLS Configuration
# =============================================================================
tls:
  enabled: true
  clusterIssuer: letsencrypt-prod
  secretName: tissi-mah-prod-tls

# =============================================================================
# Rate Limiting (strict production limits)
# =============================================================================
rateLimiting:
  global:
    minute: 60
    hour: 1000
  auth:
    second: 1
    minute: 10
    hour: 100
  createAccount:
    minute: 3
    hour: 10
    day: 20
  sensitive:
    minute: 1
    hour: 5
    day: 10

# =============================================================================
# Monitoring
# =============================================================================
metrics:
  enabled: true
  serviceMonitor:
    enabled: true
    namespace: monitoring
    labels:
      release: prometheus
    interval: 30s
    scrapeTimeout: 10s

# =============================================================================
# Logging
# =============================================================================
logging:
  level: warn
  format: json

# =============================================================================
# Services (backend endpoints)
# =============================================================================
services:
  authService:
    host: auth-service.production.svc.cluster.local
    port: 50051
    protocol: grpc

# =============================================================================
# Security
# =============================================================================
security:
  # Pod security context
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault

  # Container security context
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

  # Network policies
  networkPolicy:
    enabled: true
    ingress:
      - from:
          - namespaceSelector:
              matchLabels:
                name: ingress-nginx
        ports:
          - port: 8000
          - port: 8443
    egress:
      - to:
          - namespaceSelector:
              matchLabels:
                name: production
        ports:
          - port: 50051  # gRPC services

# =============================================================================
# Feature Flags
# =============================================================================
features:
  grpcGateway: true
  grpcWeb: true
  rateLimiting: true
  cors: true
  jwtValidation: true

# =============================================================================
# Alerts
# =============================================================================
alerts:
  enabled: true
  rules:
    - alert: KongHighErrorRate
      expr: sum(rate(kong_http_requests_total{code=~"5.."}[5m])) / sum(rate(kong_http_requests_total[5m])) > 0.05
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: "Kong high error rate"
        description: "Kong error rate is above 5%"

    - alert: KongHighLatency
      expr: histogram_quantile(0.99, sum(rate(kong_latency_bucket[5m])) by (le)) > 1000
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Kong high latency"
        description: "Kong P99 latency is above 1 second"

    - alert: KongPodNotReady
      expr: kube_pod_status_ready{namespace="production",pod=~"kong-.*"} == 0
      for: 2m
      labels:
        severity: critical
      annotations:
        summary: "Kong pod not ready"
        description: "A Kong pod has been not ready for more than 2 minutes"
