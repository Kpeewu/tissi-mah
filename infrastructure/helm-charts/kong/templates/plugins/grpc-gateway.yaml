# Kong gRPC Gateway Plugin Configuration
# Translates HTTP/REST requests to gRPC calls for backend services
# Documentation: https://docs.konghq.com/hub/kong-inc/grpc-gateway/
#
# IMPORTANT: Proto files are NOT stored here.
# They are injected at deployment time from each service's ConfigMap.
# Each service is responsible for creating its own proto ConfigMap.
#
# Architecture:
#   1. Each service creates a ConfigMap: <service>-proto (e.g., auth-service-proto)
#   2. Kong init container copies protos from service ConfigMaps to shared volume
#   3. Kong container mounts the shared volume at /usr/local/kong/proto/
#
# Service ConfigMap naming convention:
#   - auth-service    -> auth-service-proto    -> auth.proto
#   - user-service    -> user-service-proto    -> user.proto
#   - client-service  -> client-service-proto  -> client.proto
#   - payment-service -> payment-service-proto -> payment.proto
---
apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: grpc-gateway-auth
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: kong
    app.kubernetes.io/component: plugin
    plugin-type: grpc-gateway
    service: auth-service
  annotations:
    konghq.com/plugins: grpc-gateway-auth
config:
  # Proto file path - mounted from service ConfigMap via init container
  proto: /usr/local/kong/proto/auth.proto

plugin: grpc-gateway

