---
# gRPC Web plugin for browser clients (future web admin)
# Enables gRPC-Web protocol support
apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: grpc-web
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: kong
    app.kubernetes.io/component: plugin
    plugin-type: grpc-web
  annotations:
    konghq.com/plugins: grpc-web
config:
  pass_stripped_path: true

plugin: grpc-web

---
# Request Transformer for gRPC services
apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: request-transformer-grpc
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: kong
    app.kubernetes.io/component: plugin
    plugin-type: request-transformer
config:
  add:
    headers:
      - "Content-Type:application/grpc"
      - "TE:trailers"
  remove:
    headers:
      - "Accept-Encoding"

plugin: request-transformer

---
# Response Transformer for gRPC services
apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: response-transformer-grpc
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: kong
    app.kubernetes.io/component: plugin
    plugin-type: response-transformer
config:
  add:
    headers:
      - "X-Content-Type-Options:nosniff"
      - "X-Frame-Options:DENY"
  rename:
    headers:
      - "grpc-status:X-gRPC-Status"
      - "grpc-message:X-gRPC-Message"

plugin: response-transformer

---
# =============================================================================
# Kong Deployment Patch for Proto Injection
# =============================================================================
# This patch adds an init container and volumes to the Kong deployment
# to dynamically load proto files from service ConfigMaps
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kong
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: kong
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kong
  template:
    spec:
      # Init container to copy protos from service ConfigMaps
      initContainers:
        - name: proto-loader
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              set -e
              echo "=== Proto Loader: Starting ==="

              PROTO_DIR="/proto-files"
              mkdir -p $PROTO_DIR

              # Copy google/api annotations (required for HTTP mapping)
              echo "Copying google/api proto files..."
              mkdir -p $PROTO_DIR/google/api
              cp /google-api-protos/*.proto $PROTO_DIR/google/api/ 2>/dev/null || echo "No google/api protos found"

              # Copy auth-service proto
              if [ -f /service-protos/auth-service/auth.proto ]; then
                echo "Copying auth.proto from auth-service..."
                cp /service-protos/auth-service/auth.proto $PROTO_DIR/
              else
                echo "WARNING: auth.proto not found"
              fi

              # Copy user-service proto (when available)
              if [ -f /service-protos/user-service/user.proto ]; then
                echo "Copying user.proto from user-service..."
                cp /service-protos/user-service/user.proto $PROTO_DIR/
              fi

              # Copy client-service proto (when available)
              if [ -f /service-protos/client-service/client.proto ]; then
                echo "Copying client.proto from client-service..."
                cp /service-protos/client-service/client.proto $PROTO_DIR/
              fi

              # Copy payment-service proto (when available)
              if [ -f /service-protos/payment-service/payment.proto ]; then
                echo "Copying payment.proto from payment-service..."
                cp /service-protos/payment-service/payment.proto $PROTO_DIR/
              fi

              echo "=== Proto files loaded ==="
              ls -la $PROTO_DIR/
              echo "=========================="
          volumeMounts:
            # Output volume where protos are aggregated
            - name: proto-files
              mountPath: /proto-files
            # Google API protos (annotations.proto, http.proto)
            - name: google-api-protos
              mountPath: /google-api-protos
              readOnly: true
            # Service proto ConfigMaps
            - name: auth-service-proto
              mountPath: /service-protos/auth-service
              readOnly: true
            # Uncomment when services are available:
            # - name: user-service-proto
            #   mountPath: /service-protos/user-service
            #   readOnly: true
            # - name: client-service-proto
            #   mountPath: /service-protos/client-service
            #   readOnly: true
            # - name: payment-service-proto
            #   mountPath: /service-protos/payment-service
            #   readOnly: true

      containers:
        - name: kong
          volumeMounts:
            # Mount aggregated proto files
            - name: proto-files
              mountPath: /usr/local/kong/proto
              readOnly: true

      volumes:
        # Shared volume for aggregated proto files
        - name: proto-files
          emptyDir: {}

        # Google API proto files (annotations.proto, http.proto)
        - name: google-api-protos
          configMap:
            name: google-api-protos
            optional: true

        # Service proto ConfigMaps
        # These are created by each service's Helm chart
        - name: auth-service-proto
          configMap:
            name: auth-service-proto
            optional: true # Don't fail if service not deployed yet

        # Uncomment when services are available:
        # - name: user-service-proto
        #   configMap:
        #     name: user-service-proto
        #     optional: true
        # - name: client-service-proto
        #   configMap:
        #     name: client-service-proto
        #     optional: true
        # - name: payment-service-proto
        #   configMap:
        #     name: payment-service-proto
        #     optional: true

---
# =============================================================================
# Google API Proto Files
# =============================================================================
# These are standard proto files required for gRPC HTTP annotations
# Source: https://github.com/googleapis/googleapis/tree/master/google/api
apiVersion: v1
kind: ConfigMap
metadata:
  name: google-api-protos
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: kong
    app.kubernetes.io/component: proto
data:
  annotations.proto: |
    // Copyright 2015 Google LLC
    // Licensed under the Apache License, Version 2.0
    syntax = "proto3";

    package google.api;

    import "google/api/http.proto";
    import "google/protobuf/descriptor.proto";

    option go_package = "google.golang.org/genproto/googleapis/api/annotations;annotations";

    extend google.protobuf.MethodOptions {
      HttpRule http = 72295728;
    }

  http.proto: |
    // Copyright 2015 Google LLC
    // Licensed under the Apache License, Version 2.0
    syntax = "proto3";

    package google.api;

    option go_package = "google.golang.org/genproto/googleapis/api/annotations;annotations";

    message Http {
      repeated HttpRule rules = 1;
      bool fully_decode_reserved_expansion = 2;
    }

    message HttpRule {
      string selector = 1;

      oneof pattern {
        string get = 2;
        string put = 3;
        string post = 4;
        string delete = 5;
        string patch = 6;
        CustomHttpPattern custom = 8;
      }

      string body = 7;
      string response_body = 12;
      repeated HttpRule additional_bindings = 11;
    }

    message CustomHttpPattern {
      string kind = 1;
      string path = 2;
    }
