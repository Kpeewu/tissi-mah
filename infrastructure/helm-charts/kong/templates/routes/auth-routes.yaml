# Kong Routes Configuration for Auth Service
# Defines HTTP routes that proxy to the auth-service gRPC backend
# Documentation: https://docs.konghq.com/gateway/latest/key-concepts/routes/
#
# NOTE: KIC 3.x removed KongIngress.proxy and KongIngress.upstream.
# Protocol and timeouts are set via annotations on the Service in the auth-service Helm chart.
# Use KongUpstreamPolicy (configuration.konghq.com/v1beta1) for load balancing.
#
# NOTE: The Kubernetes Service for auth-service is managed by the auth-service Helm chart,
# not here. Do NOT define the Service in this file to avoid Helm ownership conflicts.
---
# =============================================================================
# Ingress Routes - Protected Endpoints (JWT Required)
# =============================================================================

# Login endpoint
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: auth-login
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: kong
    app.kubernetes.io/component: route
    service: auth-service
    endpoint: login
  annotations:
    kubernetes.io/ingress.class: kong
    # Plugin execution order (Kong handles this automatically):
    # 1. cors-global (CORS preflight)
    # 2. jwt-validation-basic (JWT validation)
    # 3. request-transformer-jwt (add JWT headers)
    # 4. rate-limiting-auth (rate limiting)
    # 5. request-transformer-grpc (prepare for gRPC)
    # 6. grpc-gateway-auth (HTTP to gRPC translation)
    # 7. response-transformer-grpc (format response)
    konghq.com/plugins: >-
      cors-global,
      jwt-validation-basic,
      rate-limiting-auth,
      request-transformer-grpc,
      grpc-gateway-auth,
      response-transformer-grpc
    konghq.com/protocols: https,http
    konghq.com/methods: POST,OPTIONS
    konghq.com/strip-path: "false"
spec:
  ingressClassName: kong
  rules:
    - host: {{ .Values.kong.host }}
      http:
        paths:
          - path: /api/v1/auth/login
            pathType: Exact
            backend:
              service:
                name: auth-service
                port:
                  number: 50051

