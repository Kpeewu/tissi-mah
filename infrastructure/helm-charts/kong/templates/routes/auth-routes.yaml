# =============================================================================
# Health Check Route (No Auth Required - Public Access)
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: auth-health
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: kong
    app.kubernetes.io/component: route
    service: auth-service
    endpoint: health
  annotations:
    kubernetes.io/ingress.class: kong
    # Health check route - NO JWT validation required
    # gRPC plugins needed because backend Service uses konghq.com/protocol: grpc
    konghq.com/plugins: cors-global,rate-limiting-global,request-transformer-grpc,grpc-gateway-auth,response-transformer-grpc
    konghq.com/protocols: https,http
    konghq.com/methods: GET,OPTIONS
