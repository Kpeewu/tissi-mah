# Job de génération du .pmtiles vectoriel pour TileServer GL.
#
# Utilise planetiler (https://github.com/onthegomap/planetiler) — outil java
# qui produit des vector tiles MapLibre-style depuis un .osm.pbf.
#
# Pré-requis : le PVC osrm-data doit contenir west-africa.osm.pbf (produit
# par osm-data-prep). Le Job lit ce fichier en read-only et écrit le .pmtiles
# dans le PVC tileserver-data.
#
# Durée typique : 30-60 min pour les 4 pays jusqu'au zoom 14.
apiVersion: batch/v1
kind: Job
metadata:
  name: tile-prep
  namespace: default
  labels:
    app: tile-prep
    tier: tiles-prep
spec:
  ttlSecondsAfterFinished: 86400
  backoffLimit: 1
  template:
    metadata:
      labels:
        app: tile-prep
    spec:
      restartPolicy: Never
      containers:
        - name: planetiler
          # Image officielle planetiler (buildée avec Jib : pas de fat-jar,
          # mais un classpath /app/classes + /app/libs déjà câblé via
          # l'ENTRYPOINT généré par Jib). On laisse donc l'ENTRYPOINT par
          # défaut faire son travail et on règle le heap via JAVA_TOOL_OPTIONS.
          image: ghcr.io/onthegomap/planetiler:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-Xmx4g"
          args:
            - "--osm-path=/osm/west-africa.osm.pbf"
            - "--output=/tiles/west-africa.pmtiles"
            - "--force"
            - "--languages=en,fr"
            - "--maxzoom=14"
            # Le profil OpenMapTiles requiert 3 datasets externes (lakes,
            # water-polygons, natural-earth, ~1 Gi cumulé). --download les
            # récupère au démarrage dans data/sources/ du container. Pour
            # éviter le re-download hebdomadaire on pourra persister ce
            # dossier dans un PVC dédié plus tard.
            - "--download"
          resources:
            requests:
              cpu: 1000m
              memory: 4Gi
            limits:
              cpu: 4000m
              memory: 6Gi
          volumeMounts:
            - name: osm-data
              mountPath: /osm
              readOnly: true
            - name: tile-data
              mountPath: /tiles
      volumes:
        - name: osm-data
          persistentVolumeClaim:
            claimName: osrm-data
            readOnly: true
        - name: tile-data
          persistentVolumeClaim:
            claimName: tileserver-data
