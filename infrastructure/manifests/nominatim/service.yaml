# Service interne Nominatim — appelé par geolocation-service via
# NOMINATIM_URL=http://nominatim-backend:8080. Pas d'Ingress.
apiVersion: v1
kind: Service
metadata:
  name: nominatim-backend
  namespace: dev
  labels:
    app: nominatim-backend
    tier: geocoding
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
  selector:
    app: nominatim-backend
