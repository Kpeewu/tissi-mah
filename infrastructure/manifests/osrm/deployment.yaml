# OSRM backend (routing engine self-hosted).
#
# Sert l'API HTTP /route/v1/{profile}/{coords}?... attendue par le client
# osrm.Client de geolocation-service.
#
# IMPORTANT : ce Deployment dépend de la présence du fichier
# /data/west-africa.osrm (et les fichiers compagnons .osrm.*) sur le PVC
# osrm-data. Avant de l'appliquer, il faut avoir lancé le Job
# osm-data-prep qui télécharge et pré-traite les extracts OSM.
#
# Réplicas : 1 en V1 (PVC RWO sur K3s local-path).
# Pour scaler, voir le commentaire dans pvc.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: osrm-backend
  namespace: default
  labels:
    app: osrm-backend
    tier: routing
spec:
  replicas: 1
  strategy:
    # Recreate (pas RollingUpdate) : un seul mount RWO possible à la fois.
    type: Recreate
  selector:
    matchLabels:
      app: osrm-backend
  template:
    metadata:
      labels:
        app: osrm-backend
        tier: routing
        app.kubernetes.io/part-of: tissi-mah
    spec:
      securityContext:
        runAsNonRoot: false
        fsGroup: 0
      containers:
        - name: osrm
          image: ghcr.io/project-osrm/osrm-backend:v5.27.1
          imagePullPolicy: IfNotPresent
          # Mode MLD (Multi-Level Dijkstra) — préprocessing plus rapide,
          # runtime acceptable, footprint mémoire raisonnable pour 4 pays.
          command: ["osrm-routed"]
          args:
            - "--algorithm"
            - "mld"
            - "--port"
            - "5000"
            - "--ip"
            - "0.0.0.0"
            - "--max-table-size"
            - "8000"
            - "--max-matching-size"
            - "5000"
            - "/data/west-africa.osrm"
          ports:
            - name: http
              containerPort: 5000
              protocol: TCP
          livenessProbe:
            httpGet:
              # /health n'existe pas dans OSRM ; on utilise une route triviale.
              # OSRM répond Ok à /route/v1/driving/0,0;0,0 (probablement NoRoute,
              # mais le serveur est UP).
              path: /route/v1/driving/0,0;0,0
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /route/v1/driving/0,0;0,0
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: 2000m
              memory: 4Gi
          volumeMounts:
            - name: osrm-data
              mountPath: /data
              readOnly: false
      volumes:
        - name: osrm-data
          persistentVolumeClaim:
            claimName: osrm-data
