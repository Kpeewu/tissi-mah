# Template de Secret MinIO — NE PAS committer les vraies valeurs.
#
# Créer avec kubectl :
#   kubectl create secret generic minio-credentials \
#     --from-literal=MINIO_ROOT_USER=minioadmin \
#     --from-literal=MINIO_ROOT_PASSWORD=<mot-de-passe-fort-32-chars> \
#     --from-literal=FILESVC_ACCESS_KEY=filesvc \
#     --from-literal=FILESVC_SECRET_KEY=<mot-de-passe-fort-service-account> \
#     -n default
#
# MINIO_ROOT_USER / MINIO_ROOT_PASSWORD : compte root admin (ne pas exposer, jamais dans file-service).
# FILESVC_ACCESS_KEY / FILESVC_SECRET_KEY : compte de service pour file-service (accès restreint).
apiVersion: v1
kind: Secret
metadata:
  name: minio-credentials
  namespace: default
  labels:
    app: minio
    tier: storage
type: Opaque
data:
  # Remplacer par : echo -n 'valeur' | base64
  MINIO_ROOT_USER:
  MINIO_ROOT_PASSWORD:
  FILESVC_ACCESS_KEY: 
  FILESVC_SECRET_KEY:
