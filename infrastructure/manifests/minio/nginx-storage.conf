# Config Nginx système pour le VPS — MinIO via docker-compose.
# Déployer sur le VPS : /etc/nginx/sites-available/storage.tissimah.kpeewu.dev
# Activer : ln -s /etc/nginx/sites-available/storage.tissimah.kpeewu.dev /etc/nginx/sites-enabled/
#
# CRITIQUE — presigned URLs & Host header :
#   proxy_set_header Host $host conserve "storage.tissimah.kpeewu.dev" envoyé à MinIO.
#   MinIO recalcule le HMAC avec ce Host pour valider la signature des URL présignées.
#   Sans cette ligne, toutes les URL présignées retournent 403.

server {
    listen 80;
    listen [::]:80;
    server_name storage.tissimah.kpeewu.dev;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name storage.tissimah.kpeewu.dev;

    ssl_certificate     /etc/letsencrypt/live/storage.tissimah.kpeewu.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/storage.tissimah.kpeewu.dev/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size    0;
    proxy_read_timeout      600s;
    proxy_send_timeout      600s;
    proxy_connect_timeout   10s;
    proxy_buffering         off;
    proxy_request_buffering off;

    location / {
        proxy_pass http://127.0.0.1:9000;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header   Connection "";
    }
}
