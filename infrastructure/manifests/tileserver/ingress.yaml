# Ingress public pour les tuiles vectorielles.
#
# Bypass complet de l'api-gateway (qui ne sait pas servir efficacement du
# binaire) : le client mobile appelle directement tiles.tissimah.kpeewu.dev et
# l'Ingress route vers TileServer GL.
#
# Cache HTTP agressif côté Ingress : les tuiles sont quasi-immutables (refresh
# hebdomadaire seulement quand on régénère le .pmtiles). max-age=7 jours +
# immutable autorise les CDN edge à long-cache, et le client mobile garde
# les tuiles en cache local.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tileserver-gl
  namespace: default
  labels:
    app: tileserver-gl
    tier: tiles
  annotations:
    # nginx-ingress / ingress-nginx-controller
    nginx.ingress.kubernetes.io/configuration-snippet: |
      add_header Cache-Control "public, max-age=604800, immutable" always;
      add_header Access-Control-Allow-Origin "*" always;
    nginx.ingress.kubernetes.io/proxy-buffering: "on"
    nginx.ingress.kubernetes.io/proxy-buffers-number: "8"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - tiles.tissimah.kpeewu.dev
      secretName: tiles-tissimah-kpeewu-dev-tls
  rules:
    - host: tiles.tissimah.kpeewu.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tileserver-gl
                port:
                  number: 8080
