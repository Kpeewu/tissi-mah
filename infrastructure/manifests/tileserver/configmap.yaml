# Config TileServer GL : déclare le dataset west-africa pointant sur le .pmtiles
# et expose les glyph PBFs des fontes pré-chargées par le Job tile-fonts.
# Le serveur expose alors :
#   /data/west-africa/{z}/{x}/{y}.pbf            — vector tiles (MVT)
#   /data/west-africa.json                       — TileJSON metadata
#   /fonts/{fontstack}/{range}.pbf               — glyphs SDF pour MapLibre
#
# Sprites et styles ne sont PAS servis : le client mobile bundle son propre
# style.json et n'utilise pas d'icônes pour le rendu actuel.
# allowedHosts ferme l'attaque par Host header poisoning (warning v5).
apiVersion: v1
kind: ConfigMap
metadata:
  name: tileserver-gl
  namespace: default
  labels:
    app: tileserver-gl
    tier: tiles
data:
  config.json: |
    {
      "options": {
        "paths": {
          "root": "/data",
          "fonts": "/data/fonts",
          "mbtiles": "/data"
        },
        "frontPage": false,
        "allowedHosts": ["tiles.tissi-mah.com", "tiles.tissimah.kpeewu.dev"]
      },
      "data": {
        "west-africa": {
          "pmtiles": "west-africa.pmtiles"
        }
      }
    }
