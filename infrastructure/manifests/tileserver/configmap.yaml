# Config TileServer GL : déclare le dataset west-africa pointant sur le .pmtiles.
# Le serveur expose alors /data/west-africa/{z}/{x}/{y}.pbf en vector tiles
# et /data/west-africa.json en TileJSON (utilisable par MapLibre GL).
#
# On sert UNIQUEMENT des vector tiles ; le rendu (fonts, sprites, styles)
# est fait côté client mobile MapLibre. On ne déclare donc pas les paths
# fonts/sprites/styles que TileServer GL v5 exige d'exister sur disque.
# allowedHosts ferme l'attaque par Host header poisoning (warning v5).
apiVersion: v1
kind: ConfigMap
metadata:
  name: tileserver-gl
  namespace: default
  labels:
    app: tileserver-gl
    tier: tiles
data:
  config.json: |
    {
      "options": {
        "paths": {
          "root": "/data",
          "mbtiles": "/data"
        },
        "frontPage": false,
        "allowedHosts": ["tiles.tissi-mah.com", "tiles.tissimah.kpeewu.dev"]
      },
      "data": {
        "west-africa": {
          "pmtiles": "west-africa.pmtiles"
        }
      }
    }
