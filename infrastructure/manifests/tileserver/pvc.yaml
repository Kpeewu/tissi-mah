# PVC pour le .pmtiles vectoriel des 4 pays.
# Taille : 5 Gi (le .pmtiles fait ~1-3 Gi pour Togo+Ghana+Bénin+Burkina à zoom 14).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tileserver-data
  namespace: default
  labels:
    app: tileserver-gl
    tier: tiles
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
