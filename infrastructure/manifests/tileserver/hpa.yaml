# HPA TileServer GL — peut scaler horizontalement librement (stateless).
# Min 2 (HA), max 4 (TileServer est très peu coûteux par pod).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: tileserver-gl
  namespace: dev
  labels:
    app: tileserver-gl
    tier: tiles
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: tileserver-gl
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
